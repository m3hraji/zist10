  <script>
    const CHAPTERS = [{"id":"ch1","number":1,"title":"دنیای زنده","subtitle":"زیست‌شناسی، گستره حیات، یاخته و بافت‌های بدن انسان","pages":"۱ تا ۱۶","description":"آشنایی با مبانی علم زیست‌شناسی، نگرش کل‌نگری، ویژگی‌های حیات، سطوح سازمان‌یابی، مولکول‌های زیستی و ساختار یاخته و بافت‌های جانوری.","icon":"dna","goftars":[{"id":"ch1_g1","number":1,"title":"زیست‌شناسی چیست؟","pages":"۲ تا ۶","summary":["زیست‌شناسی شاخه‌ای از علوم تجربی است که به بررسی علمی جانداران و فرایندهای زیستی می‌پردازد.","محدوده علم تجربی: پژوهشگران علوم تجربی فقط در جست‌وجوی علت‌های پدیده‌های طبیعی و قابل مشاهده و اندازه‌گیری‌اند. علوم تجربی نمی‌تواند درباره مفاهیم ارزشی، اخلاقی، زشتی و زیبایی یا ادبی نظر دهد.","کل‌نگری در زیست‌شناسی نوین: پیکر جانداران سامانه بزرگی است که ویژگی‌های کل سامانه چیزی بیشتر از مجموع اجزای آن است (مانند قطعات یک پازل که در کنار هم معنا پیدا می‌کنند).","نگرش بین‌رشته‌ای: زیست‌شناسان امروزی از فیزیک، شیمی، مهندسی، علوم کامپیوتر و آمار در پژوهش‌های خود بهره می‌گیرند.","کاربردهای زیست‌شناسی در خدمت انسان: تأمین غذای سالم و کافی، حفاظت از بوم‌سازگان‌ها و احیای دریاچه ارومیه، تأمین سوخت‌های زیستی پاک (مانند اتانول و گازوئیل زیستی از دانه‌های روغنی)، و پزشکی شخصی بر اساس تحلیل دنا (DNA)."],"keyPoints":["سوخت‌های فسیلی منشأ زیستی دارند اما سوخت زیستی امروزی حاصل زیست‌توده‌های تازه مانند پسماند نیشکر یا دانه‌های روغنی است.","پزشکی شخصی (Personalized Medicine) با بررسی دنا (DNA) روش‌های درمانی اختصاصی برای هر فرد طراحی می‌کند.","دانشمندان تجربی نمی‌توانند درباره خوب یا بد بودن ارزش‌های انسانی حکم بدهند؛ اساس علم تجربی مشاهده و آزمون است."],"terms":[{"term":"دنا (DNA)","explanation":"دئوکسی‌ریبونوکلئیک اسید، حامل اطلاعات وراثتی جانداران.","latin":"Deoxyribonucleic acid"},{"term":"سوخت زیستی","explanation":"سوخت‌های تجدیدپذیر به دست آمده از زیست‌توده جانداران امروزی مانند گازوئیل روغنی."},{"term":"بوم‌سازگان","explanation":"مجموعه عوامل زنده و غیرزنده یک محیط و برهم‌کنش‌های میان آنها."}],"practiceQuestions":[{"question":"چرا علم تجربی نمی‌تواند در مورد خوبی یا بدی اثرات یک پدیده قضاوت قطعی ارزشی کند؟","answer":"زیرا اساس علم تجربی بر مشاهده مستقیم یا غیرمستقیم و آزمون پدیده‌های مادی و طبیعی است و مفاهیم اخلاقی و ارزشی قابل اندازه‌گیری حسی و تجربی نیستند."},{"question":"مفهوم کل‌نگری در زیست‌شناسی نوین را توضیح دهید.","answer":"پیکر جاندار سامانه‌ای سازمان‌یافته است و ویژگی‌های حاصل از برهم‌کنش اجزا بسیار فراتر از ویژگی‌های تک‌تک اجزای مجزا است."}]},{"id":"ch1_g2","number":2,"title":"گسترهٔ حیات","pages":"۷ تا ۱۰","summary":["۷ ویژگی مشترک همه جانداران: ۱. نظم و ترتیب و سازمان‌یابی ۲. هم‌ایستایی (هومئوستازی: حفظ پایداری محیط درونی) ۳. رشد و نمو (رشد افزایش ابعاد و تعداد، نمو گذر به مرحله کیفی جدید) ۴. جذب و استفاده از انرژی ۵. پاسخ به محیط و محرک‌ها ۶. تولیدمثل ۷. سازش با محیط.","سطوح ده‌گانه سازمان‌یابی حیات: یاخته -> بافت -> اندام -> دستگاه -> فرد -> جمعیت (افراد یک گونه در یک زمان و مکان) -> اجتماع (چند جمعیت در تعامل) -> بوم‌سازگان (اجتماع + عوامل غیرزنده) -> زیست‌بوم (بوم‌سازگان‌های با اقلیم مشابه) -> زیست‌کره (کل بخش‌های حیات‌دار زمین).","مولکول‌های زیستی: ۱. کربوهیدرات‌ها (مونوساکاریدها مثل گلوکز، دی‌ساکاریدها مثل مالتوز و ساکارز و لاکتوز، پلی‌ساکاریدها مثل نشاسته، گلیکوژن و سلولز) ۲. لیپیدها (تری‌گلیسریدها، فسفولیپیدهای غشا، کلسترول) ۳. پروتئین‌ها (پلیمر آمینواسیدها، نقش آنزیمی، انقباضی و انتقالی) ۴. نوکلئیک‌اسیدها (دنا و رنا حامل رمزهای ژنتیکی)."],"keyPoints":["یاخته پایین‌ترین سطح سازمان‌یابی حیات است که تمام ویژگی‌های حیات را داراست.","تری‌گلیسریدها دو برابر کربوهیدرات‌ها انرژی در واحد وزن آزاد می‌کنند.","ساکارز از گلوکز + فروکتوز تشکیل شده؛ مالتوز از دو مولکول گلوکز تشکیل شده؛ لاکتوز قند شیر است.","گلیکوژن در کبد و ماهیچه جانوران ذخیره گلوکز است، نشاسته در گیاهان."],"terms":[{"term":"هم‌ایستایی (هومئوستازی)","explanation":"مجموعه سازوکارهایی که وضعیت درونی بدن را در محدوده‌ای ثابت و پایدار نگه می‌دارد.","latin":"Homeostasis"},{"term":"جمعیت","explanation":"گروهی از افراد هم‌گونه که در زمان و مکانی مشخص زندگی می‌کنند."},{"term":"فسفولیپید","explanation":"لیپید اصلی تشکیل‌دهنده غشای سلولی شامل گلیسرول، دو اسید چرب و یک گروه فسفات."}],"practiceQuestions":[{"question":"تفاوت مفهوم «رشد» با «نمو» در جانداران چیست؟","answer":"رشد به معنی افزایش برگشت‌ناپذیر ابعاد یا تعداد یاخته‌هاست، در حالی که نمو به معنی عبور از مرحله‌ای به مرحله دیگر و پیدایش اندام‌ها و کارکردهای جدید است (مانند تشکیل گل در گیاه)."}]},{"id":"ch1_g3","number":3,"title":"یاخته و بافت در بدن انسان","pages":"۱۱ تا ۱۶","summary":["ساختار یاخته جانوری: هسته (دارای دنا، منافذ و هستک سازنده رناتن)، سیتوپلاسم، غشای پلاسمایی با نفوذپذیری انتخابی (فسفولیپید دولایه، پروتئین‌ها، کلسترول و قندها).","اندامک‌ها: رناتن (ریبوزوم: ساخت پروتئین)، شبکه آندوپلاسمی زبر (دارای رناتن، سنتز پروتئین)، شبکه آندوپلاسمی صاف (سنتز لیپیدها)، دستگاه گلژی (بسته‌بندی و ترشح)، راکیزه (میتوکندری: تنفس سلولی و تولید ATP)، کافنده‌تن (لیزوزوم: هیدرولیز مواد با آنزیم‌ها)، میانک (سانتریول: تقسیم یاخته‌ای).","روش‌های عبور مواد از غشا: ۱. انتشار ساده (در جهت شیب غلظت بدون مصرف انرژی، مانند O2 و CO2) ۲. انتشار تسهیل‌شده (با کمک پروتئین کانال در جهت شیب غلظت بدون ATP) ۳. اسمز (انتشار آب از غشای با نفوذپذیری انتخابی) ۴. انتقال فعال (برخلاف شیب با صرف ATP توسط پروتئین‌های ناقل) ۵. درون‌بری (آندوسیتوز) و برون‌رانی (اگزوسیتوز) با تشکیل ریزکیسه و صرف ATP.","چهار بافت اصلی انسان: ۱. بافت پوششی (سنگفرشی، مکعبی، استوانه‌ای؛ یک یا چند لایه؛ دارای غشای پایه از پروتئین و گلیکوپروتئین) ۲. بافت پیوندی (سست، متراکم در زردپی و رباط، بافت چربی، خون، استخوان و غضروف) ۳. بافت ماهیچه‌ای (اسکلتی مخطط ارادی، قلبی مخطط غیرارادی با صفحات بینابینی، صاف غیرارادی دوکی‌شکل) ۴. بافت عصبی (نورون‌ها دارای جسم یاخته‌ای، دارینه‌ها و آسه)."],"keyPoints":["درون‌بری و برون‌رانی همواره به انرژی زیستی (ATP) نیاز دارند، فارغ از جهت غلظت ذرات.","بافت پوششی رگ‌های خونی ندارد و مواد غذایی از بافت پیوندی زیرین از طریق غشای پایه به آن نفوذ می‌کنند.","صفحات بینابینی در ماهیچه قلب باعث انتشار سریع پیام انقباض در کل بطن‌ها یا دهلیزها می‌شوند."],"terms":[{"term":"راکیزه","explanation":"میتوکندری؛ اندامک دو غشایی مسئول تنفس سلولی و تولید ATP.","latin":"Mitochondrion"},{"term":"کافنده‌تن","explanation":"لیزوزوم؛ اندامک حاوی آنزیم‌های تجزیه‌کننده درون سلولی.","latin":"Lysosome"},{"term":"درون‌بری و برون‌رانی","explanation":"آندوسیتوز و اگزوسیتوز؛ ورود و خروج ذرات درشت با تشکیل وزیکول و صرف ATP.","latin":"Endocytosis / Exocytosis"}],"practiceQuestions":[{"question":"چرا یاخته‌های جانوری در آب خالص متورم شده و ممکن است بترکند، اما یاخته‌های گیاهی نمی‌ترکند؟","answer":"یاخته‌های جانوری فاقد دیواره سلولی هستند و در اثر ورود آب ناشی از اسمز تا مرحله ترکیدن متورم می‌شوند؛ اما یاخته‌های گیاهی دارای دیواره سلولی محکم هستند که مانع از ترکیدن شده و حالت تورژسانس ایجاد می‌کند."}]}]},{"id":"ch2","number":2,"title":"گوارش و جذب مواد","subtitle":"ساختار لوله گوارش، آنزیم‌ها، جذب در روده، کبد و تنوع جانوری","pages":"۱۷ تا ۳۲","description":"بررسی کامل آناتومی و بافت‌شناسی دستگاه گوارش، آنزیم‌های بزاق و معده و لوزالمعده، جذب مولکول‌ها در پرزها و روده بزرگ، کبد و تنوع گوارش در حشرات، پرندگان و نشخوارکنندگان.","icon":"apple","goftars":[{"id":"ch2_g1","number":1,"title":"ساختار و عملکرد لوله گوارش","pages":"۱۸ تا ۲۴","summary":["ساختار چهار لایه لوله گوارش (از بیرون به درون): ۱. لایه بیرونی (بخشی از صفاق در شکم) ۲. لایه ماهیچه‌ای (حلقوی و طولی؛ در دهان، حلق، ابتدای مری و بنداره خارجی مخرج مخطط؛ در بقیه صاف؛ در معده لایه مورب اضافی هم وجود دارد) ۳. لایه زیرمخاطی (بافت پیوندی با شبکه عصبی) ۴. لایه مخاطی (بافت پوششی، پیوندی سست و لایه ماهیچه‌ای مخاط).","حرکات لوله گوارش: حرکات کرمی (پیش‌برنده و مخلوط‌کننده در مواجهه با بنداره بسته) و حرکات قطعه‌قطعه‌کننده (ریزکننده و مخلوط‌کننده با شیره‌ها).","گوارش در دهان: اثر آمیلاز بزاق بر نشاسته و تبدیل به دی‌ساکاریدها، لیزوزیم ضدباکتری، موسین تولیدکننده مخاط لغزنده.","بلع غذا: فرآیندی غیرارادی پس از فشار زبان به حلق؛ راه بینی توسط زبان کوچک و راه نای توسط برچاکنای (اپی‌گلوت) بسته می‌شود.","گوارش در معده: کیموس معده؛ سلول‌های پوششی سطحی مخاط ماده مخاطی و بی‌کربنات (HCO3-) ترشح کرده و سد محافظتی تشکیل می‌دهند؛ سلول‌های اصلی پپسینوژن ترشح می‌کنند؛ سلول‌های کناری اسید کلریدریک (HCl) و فاکتور داخلی معده را ترشح می‌کنند (فاکتور داخلی برای جذب ویتامین B12 در روده باریک ضروری است)."],"keyPoints":["تخریب سلول‌های کناری معده باعث عدم جذب ویتامین B12 و در نتیجه کم‌خونی خطرناک (آنمی پرنیشیوس) می‌شود.","پپسینوژن با اثر HCl به پپسین فعال تبدیل می‌شود و پپسین فعال خود نیز تولید پپسین را شتاب می‌بخشد (بازخورد مثبت).","بنداره پیلور خروج کیموس به دوازدهه را کنترل و تنظیم می‌کند."],"terms":[{"term":"برچاکنای","explanation":"اپی‌گلوت؛ غضروفی که هنگام بلع روی ورودی حنجره را می‌پوشاند.","latin":"Epiglottis"},{"term":"بنداره","explanation":"اسفنکتر؛ ماهیچه‌های حلقوی تنظیم‌کننده عبور مواد در لوله گوارش.","latin":"Sphincter"},{"term":"کیموس","explanation":"مخلوط نیمه‌مایع حاصل از گوارش مکانیکی و شیمیایی غذا در معده."}],"practiceQuestions":[{"question":"اگر ترشح فاکتور داخلی معده متوقف شود، چه پیامد خونی در پی دارد و چرا؟","answer":"فاکتور داخلی برای جذب ویتامین B12 در انتهای روده باریک ضروری است. با فقدان آن، تولید گویچه‌های قرمز در مغز استخوان دچار اختلال شده و فرد به کم‌خونی وخیم دچار می‌شود."}]},{"id":"ch2_g2","number":2,"title":"جذب مواد و تنظیم فعالیت دستگاه گوارش","pages":"۲۵ تا ۲۹","summary":["گوارش و ترشحات دوازدهه: صفرا (تولید در کبد، فاقد آنزیم، دارای نمک‌های صفراوی، کلسترول، فسفولیپید و بی‌کربنات)؛ شیره لوزالمعده (دارای بی‌کربنات و آنزیم‌های آمیلاز، لیپاز، پروتئازها و نوکلئازها)؛ شیره روده.","ساختار روده باریک برای جذب: چین‌های حلقوی، پرزها و ریزپرزهای یاخته‌های پوششی سطح جذب را صدها برابر می‌کنند. بیماری سلیاک با پروتئین گلوتن پرزها را تخریب می‌کند.","مسیر جذب مواد: قندها و آمینواسیدها وارد مویرگ‌های خونی پرز شده و از راه سیاهرگ باب به کبد می‌روند؛ اسیدهای چرب و گلیسرول وارد مویرگ لنفی بسته (شیلوس) پرز می‌شوند.","روده بزرگ و دفع: شامل روده کور، آپاندیس، کولون بالارو، افقی، پایین‌رو، راست‌روده و بنداره‌های داخلی (صاف) و خارجی (مخطط). جذب آب و املاح، سنتز ویتامین K و B توسط باکتری‌های همزیست پروبیوتیک.","تنظیم فعالیت‌ها: اعصاب خودمختار، شبکه عصبی روده‌ای دیواره لوله، هورمون گاسترین از معده (افزایش اسید و پپسینوژن) و هورمون سکرتین از دوازدهه (تحریک ترشح بی‌کربنات لوزالمعده)."],"keyPoints":["صفرا آنزیم گوارشی ندارد و گوارش چربی‌ها را به روش فیزیکی با ریز کردن قطرات تسهیل می‌کند.","خون سیاهرگ باب ابتدا وارد کبد می‌شود تا مواد مغذی ذخیره یا فرآوری شوند (سنتز گلیکوژن و پروتئین).","شاخص توده بدنی (BMI): نسبت وزن (کیلوگرم) به مجذور قد (متر). زیر ۱۹ کمبود وزن، ۱۹ تا ۲۵ وزن مناسب، ۲۵ تا ۳۰ اضافه وزن، بالای ۳۰ چاقی."],"terms":[{"term":"سکرتین","explanation":"نخستین هورمون کشف‌شده؛ از دوازدهه ترشح شده و ترشح بی‌کربنات پانکراس را تحریک می‌کند."},{"term":"زیستیار (پروبیوتیک)","explanation":"باکتری‌های مفید همزیست لوله گوارش که ویتامین‌های K و گروه B را تولید می‌کنند.","latin":"Probiotic"},{"term":"کولون‌بینی","explanation":"کولونوسکوپی؛ مشاهده و بررسی تصویری روده بزرگ به کمک آندوسکوپ.","latin":"Colonoscopy"}],"practiceQuestions":[{"question":"چرا اسیدهای چرب و لیپیدها مستقیماً وارد مویرگ‌های خونی پرز روده نمی‌شوند؟","answer":"به دلیل نامحلول بودن در آب و تشکیل ذرات درشت کیلومیکرون، ابتدا وارد مویرگ لنفی نافذتر پرز شده و پس از عبور از مجاری لنفی به سیاهرگ‌های زیرترقوه‌ای و گردش خون عمومی ملحق می‌شوند."}]},{"id":"ch2_g3","number":3,"title":"تنوع گوارش در جانداران","pages":"۳۰ تا ۳۲","summary":["جذب از سطح بدن: کرم کدو که فاقد دهان و لوله گوارش است و مواد مغذی را از بدن میزبان جذب می‌کند.","واکوئول گوارشی در تک‌یاخته‌ای‌ها: پارامسی با مژک‌ها غذا را به حفره دهانی هدایت می‌کند، تشکیل واکوئول غذایی، اتصال کافنده‌تن (لیزوزوم) و گوارش درون‌یاخته‌ای.","حفره گوارشی: در هیدر و پلاناریا کیسه‌ای با یک سوراخ برای ورود و خروج، گوارش ابتدا برون‌یاخته‌ای و سپس درون‌یاخته‌ای.","لوله گوارش جانوران: لوله گوارش یک‌طرفه با دهان و مخرج. ملخ (چینه‌دان برای نرم کردن، پیش‌معده با دندانه‌ها برای آسیاب، کیسه‌های معده و معده برای گوارش شیمیایی و جذب)؛ پرندگان دانه‌خوار (چینه‌دان، معده ترشحی، سنگدان عضلانی با سنگریزه برای خرد کردن غذا).","دستگاه گوارش نشخوارکنندگان: معده چهار قسمتی (سیرابی، نگاری، هزارلا، شیردان). سیرابی و نگاری محل تخمیر سلولز توسط میکروب‌ها؛ هزارلا برای آبگیری؛ شیردان معده واقعی با ترشح آنزیم‌های اسیدی."],"keyPoints":["در ملخ، جذب اصلی مواد در معده صورت می‌گیرد نه در روده.","معده واقعی نشخوارکنندگان شیردان است که آنزیم‌های گوارشی خود پستاندار در آن ترشح می‌شود.","پرندگان دندان ندارند؛ سنگدان ماهیچه‌ای به همراه سنگریزه‌ها نقش آسیاب کردن غذا را برعهده دارد."],"terms":[{"term":"چینه‌دان","explanation":"بخش حجیم انتهای مری در حشرات و پرندگان جهت ذخیره و نرم کردن غذا."},{"term":"سنگدان","explanation":"بخش ماهیچه‌ای معده پرندگان دانه‌خوار که غذا را به کمک سنگریزه‌ها آسیاب می‌کند."},{"term":"شیردان","explanation":"معده واقعی و ترشح‌کننده آنزیم‌های گوارشی در پستانداران نشخوارکننده."}],"practiceQuestions":[{"question":"مسیر عبور غذا در معده چهارقسمتی گاو را به ترتیب نام ببرید.","answer":"دهان -> مری -> سیرابی (تخمیر میکروبی) -> نگاری -> دهان (نشخوار مجدد) -> سیرابی -> نگاری -> هزارلا (آبگیری) -> شیردان (گوارش با آنزیم‌های شیره معده) -> روده."}]}]},{"id":"ch3","number":3,"title":"تبادلات گازی","subtitle":"دستگاه تنفس انسان، تهویه ششی، دم و بازدم و تنوع جانوری","pages":"۳۳ تا ۴۶","description":"مطالعه سازوکار تنفس انسان، نای، حبابک‌ها، سورفاکتانت، تبادل گازها، هموگلوبین، حجم‌های تنفسی، دم‌سنجی و انواع تنفس نایدیسی، پوستی، آبششی و ششی در جانوران.","icon":"wind","goftars":[{"id":"ch3_g1","number":1,"title":"سازوکار دستگاه تنفس در انسان","pages":"۳۴ تا ۳۹","summary":["نیاز به اکسیژن برای تنفس یاخته‌ای: گلوکز + اکسیژن -> ATP + آب + کربن دی‌اکسید. CO2 حل‌شده اسید کربنیک تولید کرده، pH را اسیدی می‌کند و پروتئین‌ها را تخریب می‌نماید.","بخش هادی: بینی، حلق، حنجره، نای، نایژه‌های اصلی و نایژک‌ها تا نایژک انتهایی. وظیفه: انتقال، پاکسازی با یاخته‌های مژکدار و ترشحات مخاطی، و گرم و مرطوب کردن هوا.","غضروف‌های C شکل نای: باز نگه داشتن مجرا و فراهم کردن فضای انعطاف‌پذیر پشتی برای عبور لقمه‌های بزرگ در مری.","بخش مبادله‌ای: از نایژک مبادله‌ای آغاز و به کیسه‌های حبابکی ختم می‌شود. دیواره حبابک‌ها دارای یاخته‌های نوع اول سنگفرشی و نوع دوم ترشح‌کننده عامل سطح‌فعال (سورفاکتانت) برای کاهش کشش سطحی آب و باز ماندن حبابک‌ها. درشت‌خوارها (ماکروفاژها) در حبابک‌ها ذرات را بیگانه خواری می‌کنند.","حمل گازها در خون: اکسیژن عمدتاً (۹۷٪) متصل به هموگلوبین (اکسی‌هموگلوبین) و مقداری اندک محلول در پلاسما. کربن دی‌اکسید حدود ۷۰٪ به صورت یون بی‌کربنات (با آنزیم کربنیک انیدراز گویچه‌های قرمز)، ۲۳٪ متصل به هموگلوبین و ۷٪ محلول در پلاسما. گاز کربن مونوکسید (CO) با اتصال محکم به جایگاه اکسیژن در هموگلوبین موجب خفگی و مسمومیت شدید می‌شود."],"keyPoints":["افزایش غلظت کربن دی‌اکسید بسیار خطرناک‌تر از کاهش اکسیژن است زیرا pH سلول را به سرعت اسیدی می‌کند.","در حبابک‌ها مخاط مژکدار وجود ندارد و دفاع بر عهده درشت‌خوارها (ماکروفاژها) است.","غشای پایه مشترک بین یاخته‌های سنگفرشی حبابک و مویرگ، مسیر انتشار گازها را به حداقل می‌رساند."],"terms":[{"term":"عامل سطح‌فعال (سورفاکتانت)","explanation":"ماده ترشح‌شده از یاخته‌های نوع دوم حبابک که کشش سطحی آب را کاهش داده و مانع بسته شدن حبابک می‌شود.","latin":"Surfactant"},{"term":"درشت‌خوار (ماکروفاژ)","explanation":"یاخته‌های متحرک ایمنی بیگانه خوار در حبابک‌ها که ذرات آلودگی و میکروب‌ها را می‌بلعند.","latin":"Macrophage"},{"term":"کربنیک انیدراز","explanation":"آنزیم درون گویچه‌های قرمز که ترکیب CO2 با آب و تولید اسید کربنیک را تسریع می‌کند."}],"practiceQuestions":[{"question":"چرا گاز مونوکسید کربن (CO) را قاتل خاموش می‌نامند و مکانیسم سمیت آن چیست؟","answer":"این گاز بدون بو، رنگ و طعم است. تمایل پیوندی آن با هموگلوبین بیش از ۲۰۰ برابر اکسیژن است و در همان جایگاه اتصال اکسیژن به صورت پایدار متصل می‌شود و ظرفیت انتقال اکسیژن خون را به شدت کاهش داده و مانع اکسیژن‌رسانی به بافت‌ها و مغز می‌گردد."}]},{"id":"ch3_g2","number":2,"title":"تهویهٔ ششی","pages":"۴۰ تا ۴۴","summary":["ساختار قفسه سینه و پرده جنب: شش‌ها توسط پرده دو لایه جنب احاطه شده‌اند؛ مایع جنب فشاری کمتر از جو (فشار منفی) دارد و مانع جمع‌شدن شش‌ها می‌شود.","مکانیسم دم: فرآیندی فعال؛ انقباض میان‌بند (دیافراگم مسطح می‌شود) و انقباض ماهیچه‌های بین‌دنده‌ای خارجی -> افزایش حجم قفسه سینه -> کاهش فشار درون شش -> ورود هوا به شش‌ها.","مکانیسم بازدم عادی: فرآیندی غیرفعال ناشی از بازگشت کشسانی شش‌ها و استراحت عضلات. در بازدم عمیق ماهیچه‌های بین‌دنده‌ای داخلی و ماهیچه‌های شکمی منقبض می‌شوند.","حجم‌های تنفسی (اسپیرومتری): حجم جاری (حدود ۵۰۰ میلی‌لیتر در هر تنفس عادی)، حجم ذخیره دمی (حدود ۳۰۰۰ میلی‌لیتر دم عمیق اضافی)، حجم ذخیره بازدمی (حدود ۱۲۰۰ میلی‌لیتر بازدم عمیق اضافی)، حجم باقیمانده (حدود ۱۲۰۰ میلی‌لیتر که هرگز از شش خارج نمی‌شود)، هوای مرده (حدود ۱۵۰ میلی‌لیتر در مجاری هادی).","ظرفیت حیاتی = جاری + ذخیره دمی + ذخیره بازدمی. ظرفیت تام = ظرفیت حیاتی + حجم باقیمانده.","تنظیم تنفس: مرکز تنفس در بصل‌النخاع دستور دم را صادر می‌کند؛ مرکز تنفس در پل مغز مدت زمان دم را تنظیم و به دم خاتمه می‌دهد. افزایش CO2 و کاهش اکسیژن محرک مراکز عصبی است."],"keyPoints":["حجم باقیمانده مانع از روی هم خوابیدن و چسبیدن حبابک‌ها شده و تبادل پیوسته گازها را بین دو تنفس تضمین می‌کند.","هوای مرده در بخش هادی باقی می‌ماند و در تبادل گاز شرکت نمی‌کند.","در تنفس آرام طبیعی، دیافراگم (میان‌بند) نقش اصلی را بر عهده دارد."],"terms":[{"term":"میان‌بند","explanation":"دیافراگم؛ پرده عضلانی جداکننده قفسه سینه از محوطه شکمی.","latin":"Diaphragm"},{"term":"دم‌سنج (اسپیرومتر)","explanation":"دستگاه اندازه‌گیری حجم‌ها و ظرفیت‌های تنفسی ریه.","latin":"Spirometry"},{"term":"پرده جنب","explanation":"پرده دو لایه‌ای که شش‌ها را احاطه کرده و دارای مایع جنب با فشار منفی است."}],"practiceQuestions":[{"question":"اگر قفسه سینه فردی سوراخ شود، چرا شش‌های او جمع می‌شوند؟","answer":"زیرا با ورود هوای جو به درون پرده جنب، فشار منفی مایع جنب از بین رفته و برابر با فشار جو می‌شود، در نتیجه نیروی کشسانی شش باعث جمع شدن بافت شش می‌گردد."}]},{"id":"ch3_g3","number":3,"title":"تنوع تبادلات گازی","pages":"۴۵ تا ۴۶","summary":["تک‌یاخته‌ای‌ها و هیدر: تبادل گاز به طور مستقیم از طریق انتشار از تمام سطح بدن.","تنفس نایدیسی (تراکه‌ای): در حشرات؛ لوله‌های منشعب نایدیس از منافذ پوستی به عمق بدن رفته و در کنار تمام یاخته‌ها به انشعابات بن‌بست دارای مایع ختم می‌شوند. دستگاه گردش مواد در انتقال گازهای تنفسی نقشی ندارد.","تنفس پوستی: در کرم خاکی و دوزیستان؛ شبکه مویرگی غنی زیر پوست مرطوب.","تنفس آبششی: در ستاره دریایی (برجستگی‌های ساده پوستی)، ماهیان و نوزاد دوزیستان. جهت جریان خون در مویرگ‌های آبششی برعکس جهت عبور آب از روی تیغه‌های آبششی است (سازوکار جریان متقابل) تا بازده تبادل گاز حداکثر شود.","تنفس ششی: در مهره‌داران خشکی‌زی. پمپ فشار مثبت در قورباغه (قورت دادن هوا با عضلات دهان)؛ پمپ فشار منفی در انسان و پستانداران؛ شش پرندگان دارای کیسه‌های هوادار جلویی و عقبی جهت ایجاد جریان یک‌طرفه و پیوسته اکسیژن در پرواز."],"keyPoints":["در حشرات، همولنف هیچ نقشی در جابه‌جایی گازهای تنفسی (O2 و CO2) ندارد.","جریان خون و جریان آب در تیغه‌های آبشش ماهی خلاف جهت یکدیگرند که کارایی جذب اکسیژن را بسیار بالا می‌برد.","پرندگان به دلیل داشتن کیسه‌های هوادار در دم و بازدم هوای تازه را از لوله‌های ششی عبور می‌دهند."],"terms":[{"term":"نایدیس","explanation":"لوله‌های تنفسی منشعب در بدن حشرات برای هدایت مستقیم اکسیژن به سلول‌ها."},{"term":"پمپ فشار مثبت","explanation":"سازوکار تنفسی دوزیستان که با قورت دادن هوا، آن را به داخل شش‌ها می‌رانند."},{"term":"کیسه‌های هوادار","explanation":"ساختارهای متصل به شش پرندگان که ذخیره و گردش یک‌طرفه هوای تنفسی را ممکن می‌سازند."}],"practiceQuestions":[{"question":"چرا جهت خلاف جریان خون و آب در آبشش ماهی اهمیت زیستی دارد؟","answer":"این وضعیت باعث می‌شود در تمام طول مویرگ آبششی، همواره شیب غلظت اکسیژن بین آب و خون حفظ شود و حداکثر تبادل و جذب اکسیژن (بیش از ۸۰ درصد) اتفاق بیفتد."}]}]},{"id":"ch4","number":4,"title":"گردش مواد در بدن","subtitle":"قلب، رگ‌ها، فیزیولوژی گردش خون، بافت خون و تنوع دستگاه گردش","pages":"۴۷ تا ۶۸","description":"بررسی تفصیلی آناتومی و بافت‌شناسی قلب، دریچه‌ها، بافت هادی، چرخه قلبی، فشار خون، ساختار مویرگ‌ها، دستگاه لنفی، اجزای خون، لخته و مکانیسم‌های گردش در مهره‌داران و بی‌مهرگان.","icon":"heart","goftars":[{"id":"ch4_g1","number":1,"title":"قلب","pages":"۴۸ تا ۵۴","summary":["آناتومی قلب: اندام ماهیچه‌ای توخالی دارای چهار حفره (دو دهلیز در بالا، دو بطن در پایین). بطن چپ دیواره‌ای به مراتب ضخیم‌تر از بطن راست دارد تا خون را با فشار بالا به سرتاسر بدن پمپ کند.","دریچه‌ها: دریچه دولختی (میترال) بین دهلیز و بطن چپ؛ دریچه سه‌لختی بین دهلیز و بطن راست؛ دریچه‌های سینی در ابتدای سرخرگ آئورت و ششی. بافت پیوندی در ساختار دریچه‌ها استحکام آنها را تأمین می‌کند.","رگ‌های تاجی (کرونری): تغذیه بافت قلب از سرخرگ‌های تاجی منشعب از ابتدای آئورت تأمین می‌شود. گرفتگی این رگ‌ها سکته قلبی ایجاد می‌کند.","لایه‌های دیواره قلب: درون‌شامه (اندوکارد پوششی نازک)، ماهیچه قلب (میوکارد با یاخته‌های مخطط تک یا دوهسته‌ای و صفحات بینابینی)، برون‌شامه و پیراشامه (پریکارد با مایع آبشامه).","شبکه هادی قلب: گره سینوسی-دهلیزی (پیشاهنگ یا ضربان‌ساز در دیواره پشتی دهلیز راست زیر بزرگ‌سیاهرگ زبرین)، گره دهلیزی-بطنی، دسته تارهای هدایتی و فیبرهای پورکنژ دیواره بطن‌ها.","چرخه قلبی (۰/۸ ثانیه): انقباض دهلیزها (۰/۱ ثانیه)، انقباض بطن‌ها (۰/۳ ثانیه)، استراحت عمومی (۰/۴ ثانیه). صدای اول (پوم: بسته شدن دریچه‌های دولختی و سه‌لختی)، صدای دوم (تاک: بسته شدن دریچه‌های سینی).","نوار قلب (ECG): موج P (فعالیت الکتریکی دهلیزها)، کمپلکس QRS (فعالیت الکتریکی بطن‌ها)، موج T (بازگشت بطن‌ها از حالت برانگیختگی به استراحت). برون‌ده قلبی = حجم ضربه‌ای × تعداد ضربان در دقیقه (حدود ۵ لیتر در دقیقه)."],"keyPoints":["صدای اول قلب قوی‌تر و طولانی‌تر است و با شروع انقباض بطن‌ها ایجاد می‌شود.","صفحات بینابینی قلب باعث هدایت بسیار سریع پیام الکتریکی می‌شوند تا بطن‌ها به صورت یک توده هماهنگ منقبض شوند.","گره پیشاهنگ سریع‌ترین پتانسیل خودبه‌خودی را ایجاد می‌کند و ریتم ضربان قلب را هدایت می‌نماید."],"terms":[{"term":"تاجی (کرونری)","explanation":"سرخرگ‌ها و سیاهرگ‌های اختصاصی تغذیه‌کننده ماهیچه قلب.","latin":"Coronary"},{"term":"گره پیشاهنگ","explanation":"گره سینوسی-دهلیزی؛ شروع‌کننده تحریکات الکتریکی قلب در دهلیز راست."},{"term":"برون‌ده قلبی","explanation":"حجم خونی که در مدت یک دقیقه توسط یک بطن به گردش خون رانده می‌شود."}],"practiceQuestions":[{"question":"چرا دیواره بطن چپ از دیواره بطن راست بسیار ضخیم‌تر است؟","answer":"زیرا بطن راست خون را تنها به شش‌ها که در نزدیکی قلب قرار دارند می‌فرستد (گردش ششی کم‌فشار)، اما بطن چپ باید خون را به تمام اندام‌های دوردست بدن از سر تا پا پمپ کند (گردش عمومی پرفشار) و نیازمند نیروی انقباضی بیشتری است."}]},{"id":"ch4_g2","number":2,"title":"رگ‌ها","pages":"۵۵ تا ۶۰","summary":["ساختار سرخرگ‌ها و سیاهرگ‌ها: سه لایه شامل لایه درونی (پوششی سنگفرشی و غشای پایه)، لایه میانی (ماهیچه صاف و رشته‌های کشسان الاستیک)، لایه خارجی (بافت پیوندی). سرخرگ‌ها لایه کشسان و عضلانی ضخیم‌تری دارند.","فشار خون و نبض: انبساط سرخرگ‌ها در اثر موج خون سیستولی و بازگشت کشسانی در زمان دیاستول باعث پیوستگی جریان خون می‌شود. فشار بیشینه (سیستولی) حدود ۱۲۰ و کمینه (دیاستولی) حدود ۸۰ میلی‌متر جیوه است.","انواع مویرگ‌ها: ۱. پیوسته (پیوند محکم یاخته‌ها؛ سد خونی-مغزی در دستگاه عصبی مرکزی) ۲. منفذدار (دارای روزنه‌ها با غشای پایه ضخیم در کلیه‌ها و غدد) ۳. ناپیوسته (دارای شکاف‌های درشت بین سلول‌ها در کبد و طحال و مغز استخوان).","تبادل مواد در مویرگ‌ها: در ابتدای سرخرگی فشار تراوش خون بیشتر از فشار اسمزی است و مایع خارج می‌شود؛ در انتهای سیاهرگی فشار اسمزی بیشتر از فشار خون است و بخش عمده آب بازجذب می‌گردد. مایع باقیمانده جذب رگ‌های لنفی می‌شود. کاهش پروتئین‌های خون موجب ادم (خیز) می‌شود.","بازگشت خون سیاهرگی: تلمبه ماهیچه‌ای اسکلتی دست و پا، دریچه‌های لانه‌کبوتری یک‌طرفه و فشار مکشی قفسه سینه در هنگام دم.","دستگاه لنفی: جمع‌آوری و تصفیه مایع بین‌بافتی، جذب چربی‌ها از روده، گره‌ها و اندام‌های لنفی (طحال، تیموس، لوزه‌ها، آپاندیس، مغز استخوان) و بازگشت به سیاهرگ‌های زیرترقوه‌ای."],"keyPoints":["مویرگ‌ها فاقد لایه ماهیچه‌ای هستند و تنها از یک لایه بافت پوششی سنگفرشی همراه با غشای پایه تشکیل شده‌اند.","دریچه‌های لانه‌کبوتری در سیاهرگ‌های دست و پا جریان خون را فقط به سمت قلب امکان‌پذیر می‌کنند.","کمبود آلبومین پلاسما فشار اسمزی خون را پایین آورده و منجر به ورم و تجمع مایع در بافت‌ها (خیز/ادم) می‌شود."],"terms":[{"term":"دریچه لانه‌کبوتری","explanation":"دریچه‌های هلالی درون سیاهرگ‌ها برای هدایت یک‌طرفه خون به سمت قلب."},{"term":"خیز (ادم)","explanation":"تجمع غیرطبیعی مایع میان‌بافتی در اندام‌ها ناشی از کاهش بازجذب مویرگی.","latin":"Edema"},{"term":"بنداره مویرگی","explanation":"حلقه ماهیچه‌ای در ابتدای برخی مویرگ‌ها که جریان خون بافت را تنظیم می‌کند."}],"practiceQuestions":[{"question":"چرا مویرگ‌های کبد از نوع ناپیوسته هستند؟","answer":"زیرا یاخته‌های کبدی پروتئین‌های درشت پلاسمایی (مانند آلبومین و فیبرینوژن) را تولید و ترشح می‌کنند و این مولکول‌های درشت تنها از شکاف‌های باز مویرگ‌های ناپیوسته می‌توانند وارد جریان خون شوند."}]},{"id":"ch4_g3","number":3,"title":"خون","pages":"۶۱ تا ۶۴","summary":["ترکیب خون: ۵۵ درصد خوناب (پلاسما: ۹۰٪ آب، پروتئین‌های آلبومین، فیبرینوژن، گلوبولین‌ها، املاح و مواد غذایی) و ۴۵ درصد عناصر یاخته‌ای (خون‌بهر یا هماتوکریت).","گویچه‌های قرمز (اریتروسیت‌ها): سلول‌های مقعرالطرفین بدون هسته و اندامک در پستانداران، مملو از هموگلوبین، طول عمر ۱۲۰ روز، تخریب در کبد و طحال، تنظیم تولید توسط هورمون اریتروپویتین مترشحه از کلیه و کبد.","گویچه‌های سفید (لوکوسیت‌ها): ۱. نوتروفیل (هسته چندقسمتی، دانه‌های ریز، بیگانه‌خواری سریع) ۲. ائوزینوفیل (هسته دومصوتی دمبلی، ضد انگل‌ها و آلرژی) ۳. بازوفیل (دانه‌های درشت تیره ترشح‌کننده هیستامین و هپارین) ۴. مونوسیت (هسته لوبیایی، تبدیل به ماکروفاژ در بافت) ۵. لنفوسیت (هسته گرد درشت، ایمنی اختصاصی B و T).","گرده‌ها (پلاکت‌ها) و انعقاد خون: قطعات سیتوپلاسمی از مگاکاریوسیت‌های مغز استخوان. در خونریزی جزئی تشکیل درپوش پلاکتی؛ در خونریزی شدید فعال شدن پروترومبیناز با یون کلسیم و ویتامین K -> تبدیل پروترومبین به ترومبین -> تبدیل فیبرینوژن محلول به فیبرین نامحلول و ایجاد شبکه لخته."],"keyPoints":["کاهش اکسیژن خون ترشح هورمون اریتروپویتین از کلیه را افزایش داده و سرعت تولید گلبول‌های قرمز در مغز استخوان را بالا می‌برد.","ویتامین B12 و اسید فولیک برای تقسیم طبیعی سلول‌های بنیادی مغز استخوان در خون‌سازی ضروری هستند.","آزمایش PT زمان پروترومبین و عملکرد فاکتورهای انعقادی خون را ارزیابی می‌کند (حدود ۱۲ ثانیه)."],"terms":[{"term":"خون‌بهر (هماتوکریت)","explanation":"درصد حجم گویچه‌های قرمز نسبت به حجم کل خون.","latin":"Hematocrit"},{"term":"گرده (پلاکت)","explanation":"قطعات یاخته‌ای بدون هسته حاصل از مگاکاریوسیت که در انعقاد خون نقش دارند.","latin":"Platelet"},{"term":"اریتروپویتین","explanation":"هورمون کلیوی تحریک‌کننده تولید گویچه‌های قرمز در مغز استخوان."}],"practiceQuestions":[{"question":"مراحل انعقاد خون را پس از آسیب رگ به صورت خلاصه بیان کنید.","answer":"آسیب بافتی و پلاکت‌ها -> ترشح آنزیم پروترومبیناز -> تبدیل پروترومبین به ترومبین (با کمک کلسیم و ویتامین K) -> ترومبین فیبرینوژن محلول پلاسما را به رشته‌های نامحلول فیبرین تبدیل می‌کند -> رشته‌های فیبرین سلول‌های خونی را به دام انداخته و لخته تشکیل می‌دهند."}]},{"id":"ch4_g4","number":4,"title":"تنوع گردش مواد در جانداران","pages":"۶۵ تا ۶۸","summary":["گردش آب در اسفنج‌ها: ورود آب از منافذ دیواره با ضربان تاژک یاخته‌های یقه‌دار و خروج از منفذ بزرگ بالایی.","حفره گوارشی: در هیدر و کرم پهن پلاناریا؛ انشعابات وسیع حفره، مواد را به تمام یاخته‌ها می‌رساند.","سامانه گردش باز: در بندپایان مانند ملخ؛ قلب همولنف را به فضاهای میان‌یاخته‌ای پمپ می‌کند (فاقد مویرگ است).","سامانه گردش بسته: در کرم خاکی (کرم حلقوی) خون همواره درون رگ‌ها و مویرگ‌ها جریان دارد.","گردش ساده در ماهی: قلب دوحفره‌ای (یک دهلیز و یک بطن)؛ خون تیره پس از عبور از بطن به آبشش‌ها رفته، اکسیژن‌دار می‌شود و مستقیماً به تمام بافت‌ها می‌رود و سپس به قلب برمی‌گردد.","گردش مضاعف در سایر مهره‌داران: دوزیستان قلب سه‌حفره‌ای (دو دهلیز و یک بطن مشترک)؛ پستانداران و پرندگان و کروکودیل‌ها قلب چهارحفره‌ای با جدایی کامل بطن چپ و راست که فشار خون بالا و اکسیژن‌رسانی بهینه را تضمین می‌کند."],"keyPoints":["همولنف در گردش باز جانشین خون، لنف و مایع بین‌یاخته‌ای است.","در گردش ساده ماهی، خون با فشار پایین از آبشش‌ها وارد سرخرگ پشتی و مویرگ‌های اندام‌ها می‌شود.","جدایی کامل بطن‌ها در پرندگان و پستانداران مانع مخلوط شدن خون تیره و روشن شده و دمای ثابت بدن را پشتیبانی می‌کند."],"terms":[{"term":"همولنف","explanation":"مایع جاری در گردش باز بندپایان که وظایف خون و مایع میان‌بافتی را انجام می‌دهد."},{"term":"گردش ساده","explanation":"سامانه‌ای که در آن خون در هر چرخه گردش کامل در بدن، فقط یک‌بار از قلب عبور می‌کند (مانند ماهی)."},{"term":"گردش مضاعف","explanation":"سامانه‌ای که خون در یک چرخه کامل دو بار از قلب عبور می‌کند (یک پمپ برای شش‌ها، یک پمپ برای عمومی بدن)."}],"practiceQuestions":[{"question":"مزیت قلب چهارحفره‌ای با بطن‌های کاملاً تفکیک‌شده در پرندگان و پستانداران چیست؟","answer":"مانع اختلاط خون تیره و روشن شده، اکسیژن‌رسانی با حداکثر غلظت و با فشار خون بالا به بافت‌ها انجام می‌شود که برای تأمین نیاز بالای سوخت‌وساز جانوران خون‌گرم ضروری است."}]}]},{"id":"ch5","number":5,"title":"تنظیم اسمزی و دفع مواد زائد","subtitle":"هم‌ایستایی، کلیه و گردیزه‌ها، تشکیل ادرار و تنوع دفع جانوری","pages":"۶۹ تا ۷۸","description":"شناخت عملکرد کلیه، آناتومی بخش قشری و مرکزی، گردیزه (نفرون)، مکانیسم‌های تراوش و بازجذب و ترشح، هورمون ضدادراری، دفع در حشرات، ماهیان و پرندگان.","icon":"droplet","goftars":[{"id":"ch5_g1","number":1,"title":"هم‌ایستایی و کلیه‌ها","pages":"۷۰ تا ۷۲","summary":["مفهوم هم‌ایستایی: ثابت نگه داشتن شرایط محیط داخلی (آب، یون‌ها، قند، دما و pH) برای عملکرد طبیعی سلول‌ها.","موقعیت و حفاظت از کلیه: دو عدد در طرفین ستون مهره‌ها پشت محوطه شکمی؛ کلیه راست به دلیل موقعیت کبد قدری پایین‌تر از کلیه چپ است. کپسول فیبری پیوندی و بافت چربی محافظ دور کلیه (تحلیل شدید چربی باعث افتادگی کلیه و انسداد میزنای می‌شود).","بخش‌های کلیه: بخش قشری، بخش مرکزی (هرم‌های کلیوی)، لگنچه و میزنای.","گردیزه (نفرون): واحد عملکردی کلیه (حدود ۱ میلیون در هر کلیه). شامل کپسول بومن، لوله پیچ‌خورده نزدیک، قوس هنله (U شکل)، لوله پیچ‌خورده دور و اتصال به مجرای جمع‌کننده.","گردش خون کلیوی: سرخرگ کلیه -> انشعابات بین‌هرمی -> سرخرگ آوران -> کلافک (گلومرول مویرگی درون کپسول بومن) -> سرخرگ وابران -> شبکه مویرگی دورلوله‌ای -> سیاهرگ کلیه."],"keyPoints":["قطر سرخرگ آوران بیشتر از سرخرگ وابران است که باعث ایجاد فشار تراوشی بالا در مویرگ‌های کلافک می‌شود.","تحلیل چربی دور کلیه بر اثر رژیم‌های لاغری غیراصولی خطر تاخوردگی میزنای و نارسایی کلیه را در پی دارد.","کلافک تنها شبکه مویرگی بدن است که بین دو سرخرگ (آوران و وابران) قرار گرفته است."],"terms":[{"term":"گردیزه (نفرون)","explanation":"واحد ساختاری و کارکردی میکروسکوپی کلیه مسئول تصفیه خون و تولید ادرار.","latin":"Nephron"},{"term":"کلافک (گلومرول)","explanation":"شبکه مویرگ‌های منفذدار داخل کپسول بومن که تحت فشار خون بالا تراوش را انجام می‌دهد.","latin":"Glomerulus"},{"term":"لَپ کلیه","explanation":"مجموعه هر هرم کلیوی به همراه ناحیه قشری پوشاننده آن.","latin":"Lobe"}],"practiceQuestions":[{"question":"چرا قطر سرخرگ آوران از سرخرگ وابران بیشتر است؟","answer":"این اختلاف قطر مقاومت بالایی در برابر خروج خون ایجاد کرده و باعث افزایش چشمگیر فشار هیدروستاتیک خون درون کلافک می‌شود که نیروی محرکه اصلی برای پدیده تراوش است."}]},{"id":"ch5_g2","number":2,"title":"تشکیل ادرار و تخلیهٔ آن","pages":"۷۳ تا ۷۵","summary":["سه مرحله تشکیل ادرار: ۱. تراوش (خروج غیرانتخابی آب و مولکول‌های ریز از کلافک به کپسول بومن بر اساس اندازه و به کمک پاهای یاخته‌های پودوسیت) ۲. بازجذب (بازگشت مواد مفید مانند گلوکز، اسیدآمینه، آب و املاح از لوله گردیزه به خون دورلوله‌ای، فعال یا غیرفعال؛ بیشترین بازجذب در لوله نزدیک با ریزپرزها) ۳. ترشح (انتقال فعال مواد زائد، داروها، سموم و یون‌های H+ و K+ از خون دورلوله‌ای به لوله گردیزه برای تنظیم pH).","تخلیه ادرار: انقباض کرمی ماهیچه‌های صاف میزنای -> مثانه -> کشیدگی دیواره مثانه -> تحریک انعکاس تخلیه -> باز شدن بنداره داخلی میزراه (غیرارادی صاف) و کنترل اختیاری بنداره خارجی میزراه (ارادی مخطط).","ترکیب شیمیایی ادرار: ۹۵٪ آب، املاح، اوره (سم‌زدایی آمونیاک ناشی از تخریب آمینواسیدها در کبد با ترکیب CO2)، اسید اوریک (کم‌محلول در آب، رسوب آن باعث سنگ کلیه و نقرس می‌شود).","تنظیم آب: ترشح هورمون ضدادراری (ADH) از هیپوتالاموس/هیپوفیز پسین با افزایش غلظت خوناب، افزایش بازجذب آب در کلیه و تولید ادرار غلیظ. کمبود هورمون بیماری دیابت بی‌مزه را ایجاد می‌کند."],"keyPoints":["در تراوش پروتئین‌های درشت و یاخته‌های خونی عبور نمی‌کنند؛ وجود آنها در ادرار نشانه آسیب کلافک است.","گلوکز و آمینواسیدها در فرد سالم در لوله پیچ‌خورده نزدیک ۱۰۰ درصد بازجذب می‌شوند و در ادرار دفع نمی‌شوند.","تنظیم pH خون توسط کلیه‌ها با ترشح یون هیدروژن (اسید) و بازجذب بی‌کربنات صورت می‌گیرد."],"terms":[{"term":"پودوسیت","explanation":"یاخته‌های لایه درونی کپسول بومن با پاهای کوتاه و شکاف‌های تراوشی باریک دور مویرگ‌ها."},{"term":"هورمون ضدادراری (ADH)","explanation":"هورمون افزایش‌دهنده نفوذپذیری به آب و بازجذب آب در مجاری جمع‌کننده کلیه."},{"term":"نقرس","explanation":"بیماری مفصلی ناشی از رسوب بلورهای اسید اوریک در بافت مفاصل."}],"practiceQuestions":[{"question":"اگر کلیه‌ها نتوانند اوره را دفع کنند، چه خطری بیمار را تهدید می‌کند و اوره چگونه در بدن تولید می‌شود؟","answer":"تجمع اوره و ترکیبات زائد نیتروژن‌دار (اورمی) باعث مسمومیت سلول‌ها و کما می‌شود. اوره در کبد از ترکیب آمونیاک بسیار سمی (حاصل از تجزیه اسیدهای آمینه) با کربن دی‌اکسید ساخته می‌شود تا سمیت آن کاهش یابد."}]},{"id":"ch5_g3","number":3,"title":"تنوع دفع و تنظیم اسمزی در جانداران","pages":"۷۶ تا ۷۸","summary":["تک‌یاخته‌ای‌ها: دفع با انتشار یا واکوئول‌های انقباضی (مانند پارامسی آب شیرین که آب ورودی بر اثر اسمز را مداوم تخلیه می‌کند).","بی‌مهرگان: نفریدی (لوله‌ای با منفذ خروجی در کرم‌ها)، آبشش در سخت‌پوستان (دفع آمونیاک با انتشار ساده).","لوله‌های مالپیگی در حشرات: لوله‌های کور منتهی به روده؛ اوریک اسید به همراه آب و یون‌ها وارد مالپیگی شده، در روده آب و املاح بازجذب و اوریک اسید با مدفوع دفع می‌شود.","مهره‌داران آبزی: ماهیان آب شیرین (محیط رقیق، ورود مداوم آب، آب نمی‌نوشند، ادرار رقیق فراوان، جذب فعال نمک از آبشش)؛ ماهیان آب شور استخوانی (محیط غلیظ، خطر از دست دادن آب، نوشیدن فراوان آب دریا، ادرار غلیظ اندک، دفع یون‌ها از آبشش و کلیه).","ماهیان غضروفی (کوسه‌ها و سفره‌ماهی‌ها): حفظ تعادل با ترشح محلول نمک غلیظ از غدد راست‌روده‌ای و انباشت اوره در خون.","پرندگان و خزندگان دریایی/بیابانی: کلیه با بازجذب آب قوی، دفع اسید اوریک خمیری، غدد نمکی نزدیک چشم یا زبان برای دفع نمک مازاد."],"keyPoints":["ماده دفعی حشرات اسید اوریک است که کمترین اتلاف آب را دارد و به شکل نیمه‌جامد دفع می‌شود.","ماهیان آب شیرین آب نمی‌نوشند و ادرار بسیار رقیق و پرحجم دفع می‌کنند؛ ماهیان آب شور برعکس، آب زیادی می‌نوشند.","غدد نمکی در پرندگان دریایی مانند مرغ توفان نمک غلیظ را از طریق بینی و نوک خارج می‌کنند."],"terms":[{"term":"لوله‌های مالپیگی","explanation":"ساختار ترشحی دفعی حشرات متصل به لوله گوارش."},{"term":"غدد راست‌روده‌ای","explanation":"غدد ترشح نمک غلیظ در روده ماهیان غضروفی مانند کوسه."},{"term":"واکوئول انقباضی","explanation":"اندامک ویژه پارامسی برای پمپ کردن آب اضافی خارج از سلول."}],"practiceQuestions":[{"question":"چرا ماهیان آب شیرین بر خلاف ماهیان آب شور، به ندرت آب می‌نوشند؟","answer":"چون فشار اسمزی بدن آنها بیشتر از آب شیرین اطراف است و آب به طور طبیعی از طریق پوست و آبشش‌ها وارد بدنشان می‌شود؛ بنابراین برای جلوگیری از رقیق شدن مایعات بدن، آب نمی‌نوشند و ادرار رقیق فراوانی دفع می‌کنند."}]}]},{"id":"ch6","number":6,"title":"از یاخته تا گیاه","subtitle":"دیواره یاخته‌ای گیاهی، سامانه‌های بافتی و ساختار مریستم‌ها","pages":"۷۹ تا ۹۶","description":"ویژگی‌های اختصاصی یاخته گیاهی، دیواره نخستین و پسین، لان و پلاسمودسم، تورژسانس، واکوئول، دیسه‌ها و رنگیزه‌ها، سامانه‌های بافتی پوششی، زمینه‌ای و آوندی، مریستم‌های نخستین و پسین.","icon":"sprout","goftars":[{"id":"ch6_g1","number":1,"title":"ویژگی‌های یاختهٔ گیاهی","pages":"۸۰ تا ۸۵","summary":["دیواره یاخته‌ای: تیغه میانی (از جنس پکتین، چسباننده یاخته‌ها)، دیواره نخستین (دارای سلولز و پکتین، منعطف و همراه با رشد یاخته)، دیواره پسین (درونی‌تر، متراکم و دارای چوب/لیگنین، مانع رشد بیشتر یاخته).","ارتباط یاخته‌ها: پلاسمودسم‌ها (کانال‌های سیتوپلاسمی پیونددهنده پروتوپلاست‌ها) در مناطقی به نام لان (ناحیه نازک دیواره).","واکوئول و پدیده‌های اسمزی: واکوئول مرکزی حاوی شیره واکوئولی؛ تورژسانس (حالت پرآب و شاداب یاخته‌ها که به اندام‌های علفی استحکام می‌بخشد)؛ پلاسمولیز (خروج آب و جدا شدن غشا از دیواره در محیط غلیظ).","دیسه‌ها (پلاست‌ها): سبزدیسه (کلروپلاست دارای کلروفیل برای فتوسنتز)، رنگ‌دیسه (کروموپلاست دارای کاروتنوئیدها مانند کاروتن نارنجی هویج)، نشادیسه (آمیلوپلاست فاقد رنگیزه برای ذخیره نشاسته مانند غده سیب‌زمینی).","سایر ترکیبات گیاهی: آنتوسیانین‌ها (رنگیزه‌های محلول در آب واکوئول مانند کلم بنفش و پرتقال تو‌سرخ)، گلوتن در بذر گندم، شیرابه و آلکالوئیدها در دفاع علیه گیاه‌خواران."],"keyPoints":["تیغه میانی قدیمی‌ترین لایه دیواره است و در خارجی‌ترین موقعیت قرار دارد.","تشکیل دیواره پسین چوبی با لیگنین مانع از رشد بیشتر یاخته شده و معمولاً به مرگ پروتوپلاست می‌انجامد.","آنتوسیانین در واکوئول قرار دارد و رنگ آن با تغییر pH محیط تغییر می‌کند؛ اما کاروتنوئیدها درون پلاست‌ها (رنگ‌دیسه‌ها) هستند."],"terms":[{"term":"تیغه میانی","explanation":"لایه ساخته‌شده از پکتین که در هنگام تقسیم یاخته‌ای بین دو یاخته جدید تشکیل می‌شود."},{"term":"پلاسمودسم","explanation":"کانال‌های سیتوپلاسمی بین سلول‌های گیاهی مجاور جهت ترابری مواد."},{"term":"سبزدیسه (کلروپلاست)","explanation":"اندامک فتوسنتزکننده حاوی سبزینه و کاروتنوئیدها.","latin":"Chloroplast"}],"practiceQuestions":[{"question":"تفاوت محل ذخیره کاروتنوئیدها با آنتوسیانین‌ها در یاخته گیاهی چیست؟","answer":"کاروتنوئیدها رنگیزه‌های محلول در چربی هستند و درون دیسه‌ها (رنگ‌دیسه یا سبزدیسه) ذخیره می‌شوند، در حالی که آنتوسیانین‌ها محلول در آب بوده و درون واکوئول مرکزی ذخیره می‌گردند."}]},{"id":"ch6_g2","number":2,"title":"سامانهٔ بافتی","pages":"۸۶ تا ۸۹","summary":["سه سامانه بافتی در گیاهان نهاندانه: ۱. سامانه پوششی ۲. سامانه زمینه‌ای ۳. سامانه آوندی.","سامانه بافت پوششی: روپوست (اپیدرم) در اندام‌های جوان معمولاً یک لایه یاخته پوشیده از پوستک (کوتیکول لیپیدی مومی). یاخته‌های تمایزیافته روپوست: یاخته‌های نگهبان روزنه (تنها یاخته روپوست دارای کلروپلاست)، کرک‌ها، یاخته‌های ترشحی، و تارهای کشنده ریشه (فاقد پوستک جهت جذب آب). در اندام‌های مسن پیراپوست جانشین روپوست می‌شود.","سامانه بافت زمینه‌ای: ۱. پارانشیم (نرم‌آکند: سلول‌های زنده با دیواره نخستین نازک، فتوسنتز، ذخیره مواد و ترمیم) ۲. کلانشیم (چسب‌آکند: سلول‌های زنده با دیواره نخستین ضخیم، انعطاف‌پذیر و استحکامی زیر روپوست) ۳. اسکلرانشیم (سخت‌آکند: دیواره پسین ضخیم چوبی با لیگنین، سلول‌های مرده شامل فیبرهای دراز و اسکلرئیدهای کوتاه مانند بافت شنی گلابی).","سامانه بافت آوندی: آوند چوبی (ترابری شیره خام، سلول‌های مرده با لیگنین شامل تراکئیدهای دوکی و عناصر آوندی گشادتر)؛ آوند آبکشی (ترابری شیره پرورده، سلول‌های زنده بدون هسته با صفحات آبکشی به همراه یاخته‌های همراه)."],"keyPoints":["یاخته‌های نگهبان روزنه تنها یاخته‌های بافت روپوست هستند که سبزینه (کلروپلاست) دارند و فتوسنتز می‌کنند.","تارهای کشنده ریشه جوان پوستک ندارند زیرا وجود پوستک مانع نفوذ و جذب آب از خاک می‌شود.","یاخته‌های آوند آبکش زنده‌اند اما هسته خود را از دست داده‌اند و یاخته‌های همراه با هسته درشت به آنها کمک می‌کنند."],"terms":[{"term":"نرم‌آکند (پارانشیم)","explanation":"بافت زمینه‌ای پرکننده با دیواره نازک سلولزی فعال در فتوسنتز و ذخیره.","latin":"Parenchyma"},{"term":"سخت‌آکند (اسکلرانشیم)","explanation":"بافت استحکامی گیاه با دیواره پسین لیگنینی و سلول‌های مرده شامل فیبر و اسکلرئید.","latin":"Sclerenchyma"},{"term":"تراکئید","explanation":"یاخته‌های دراز و باریک دوکی‌شکل آوند چوبی با انتهای مخروطی."}],"practiceQuestions":[{"question":"چرا سلول‌های کلانشیم می‌توانند مانع رشد اندام جوان نشوند در حالی که اسکلرانشیم مانع رشد است؟","answer":"سلول‌های کلانشیم زنده هستند و فقط دیواره نخستین ضخیم و انعطاف‌پذیر دارند که همراه با رشد اندام گسترش می‌یابد؛ اما اسکلرانشیم دیواره پسین ضخیم چوبی و غیرقابل کشش دارد و سلول‌های آن مرده‌اند."}]},{"id":"ch6_g3","number":3,"title":"ساختار گیاهان","pages":"۹۰ تا ۹۶","summary":["مریستم‌های نخستین: در نوک ساقه و ریشه؛ یاخته‌های کوچک با هسته درشت مرکزی و تقسیم مداوم. مریستم نخستین ریشه توسط کلاهک محافظت می‌شود (کلاهک با ترشح پلی‌ساکارید نفوذ ریشه را آسان می‌کند). مریستم نخستین ساقه در جوانه راسی و جانبی و گره‌ها وجود دارد و باعث رشد طولی می‌شود.","مقایسه ساقه و ریشه تک‌لپه و دولپه: در ریشه دولپه آوند چوبی به شکل ستاره در مرکز است؛ در تک‌لپه استوانه آوندی حلقوی است. در ساقه دولپه دسته‌های آوندی روی یک حلقه منظم چیده شده‌اند، در ساقه تک‌لپه پراکنده‌اند.","مریستم‌های پسین (لایه‌زای) در گیاهان چوبی دولپه: ۱. کامبیوم چوب‌آبکش (آوندساز: به سمت داخل چوب پسین و به سمت بیرون آبکش پسین تولید می‌کند؛ میزان چوب تولیدی بسیار بیشتر است) ۲. کامبیوم چوب‌پنبه‌ساز (به سمت بیرون چوب‌پنبه مرده ضدآب و به سمت داخل پارانشیم می‌سازد که مجموعه آنها پیراپوست یا پریدرم را تشکیل می‌دهد).","عدسک: شکاف‌های بافت پیراپوست برای تبادل گاز در ساقه‌های چوبی مسن.","سازش‌های گیاهی: برگ خرزهره (پوستک بسیار ضخیم، روزنه‌های فرورفته در غار با کرک‌های رطوبت‌گیر)؛ شش‌ریشه در درخت حرا (ریشه‌های هوایی بیرون از آب برای جذب اکسیژن در باتلاق شور)."],"keyPoints":["گیاهان تک‌لپه (مانند گندم، ذرت و نخل) فاقد مریستم پسین هستند و افزایش قطر تنه درخت نخل مربوط به بافت‌های مریستم نخستین است.","آنچه به عنوان پوست درخت کنده می‌شود شامل تمام لایه‌های بیرون از کامبیوم آوندساز است (آبکش پسین و پیراپوست).","روزنه‌های درون غار خرزهره با به دام انداختن هوای مرطوب، تعرق در گرمای سوزان را به شدت کاهش می‌دهند."],"terms":[{"term":"پارزای (مریستم)","explanation":"بافت‌های زاینده گیاهی دارای توانایی تقسیم مداوم و تولید سلول‌های تمایزیافته.","latin":"Meristem"},{"term":"لایه‌زای (کامبیوم)","explanation":"مریستم‌های پسین سازنده چوب، آبکش و چوب‌پنبه در گیاهان چوبی دولپه.","latin":"Cambium"},{"term":"شش‌ریشه","explanation":"ریشه‌های ویژه درخت حرا که از آب و لجن بیرون آمده و اکسیژن تنفس ریشه را تأمین می‌کنند."}],"practiceQuestions":[{"question":"اگر حلقه‌ای از پوست درخت را کاملاً برداریم (حلقه‌برداری)، چرا پس از مدتی بخش بالای حلقه متورم شده و سرانجام ریشه می‌میرد؟","answer":"چون آوند آبکشی که در پوست قرار دارد برداشته می‌شود و جریان شیره پرورده از برگ‌ها به سمت ریشه قطع می‌گردد؛ قندها در بالای حلقه انباشته شده و تورم ایجاد می‌کنند، و با گرسنگی و مرگ ریشه، کل درخت خشک می‌شود."}]}]},{"id":"ch7","number":7,"title":"جذب و انتقال مواد در گیاهان","subtitle":"تغذیه گیاهی، همزیستی، مسیرهای جذب و تعرق و الگوی مونش","pages":"۹۷ تا ۱۱۸","description":"نیازهای غذایی گیاهان، خاک و گیاخاک، جذب نیتروژن و فسفر، قارچ‌ریشه‌ای و باکتری‌های همزیست، انتقال در مسیرهای کوتاه، صعود شیره خام با تعرق و جریان فشاری شیره پرورده.","icon":"layers","goftars":[{"id":"ch7_g1","number":1,"title":"تغذیهٔ گیاهی","pages":"۹۸ تا ۱۰۱","summary":["مواد مورد نیاز گیاه: کربن از CO2 هوا از راه روزنه‌ها؛ آب و یون‌های معدنی از خاک از طریق ریشه.","خاک و گیاخاک (هوموس): لایه سطحی حاوی بقایای در حال تجزیه جانداران با بار منفی که یون‌های مثبت مغذی (مثل K+ و Ca2+) را نگه‌داشته و مانع شست‌وشوی آنها می‌شود و ساختار اسفنجی به خاک می‌دهد.","جذب نیتروژن و فسفر: نیتروژن هوا (N2) قابل استفاده مستقیم گیاه نیست و باید به آمونیوم (+NH4) یا نیترات (-NO3) تبدیل شود (تثبیت نیتروژن توسط باکتری‌ها)؛ فسفر به فرم یون فسفات جذب می‌شود.","کودها: کودهای آلی (آزادسازی کند مواد مغذی، ایمن‌تر اما با خطر عوامل بیماری‌زا)، کودهای شیمیایی (آزادسازی سریع با عوارض شست‌وشو و شکوفایی جلبکی و اوتروفیکاسیون)، کودهای زیستی (باکتری‌های مفید خاک).","اصلاح خاک‌های شور و اسیدی و گیاه‌پالایی: کشت گیاهان تجمع‌دهنده نمک یا فلزات سنگین (مانند سرخس انباشت‌کننده آرسنیک)."],"keyPoints":["گیاخاک دارای بارهای منفی است و یون‌های دارای بار مثبت را جذب و حفظ می‌کند.","مصرف بی‌رویه کودهای شیمیایی فسفاته و نیتروژنه در کشاورزی باعث ورود به رودخانه‌ها، رشد بیش از حد جلبک‌ها و کاهش اکسیژن آب و مرگ آبزیان می‌شود.","تغییر رنگ گل ادریسی به صورتی در خاک قلیایی و آبی در خاک اسیدی به دلیل تجمع آلومینیوم در گیاه است."],"terms":[{"term":"گیاخاک (هوموس)","explanation":"بخش آلی تجزیه‌شده و اسفنجی سطح خاک دارای بار منفی.","latin":"Humus"},{"term":"تثبیت نیتروژن","explanation":"تبدیل مولکول N2 جو به ترکیبات معدنی قابل جذب گیاهان مانند یون نیترات یا آمونیوم."},{"term":"گیاه‌پالایی","explanation":"استفاده از گیاهان ویژه برای پاکسازی و پالایش خاک از آلاینده‌ها یا املاح اضافی."}],"practiceQuestions":[{"question":"چرا گیاهان با وجود فراوانی گاز نیتروژن در جو (۷۸٪) به کود نیتروژن یا باکتری‌های همزیست نیاز دارند؟","answer":"زیرا پیوند سه‌گانه اشتراکی بین دو اتم نیتروژن در مولکول N2 بسیار قوی است و گیاهان آنزیم لازم برای شکستن آن را ندارند؛ بنابراین باید به فرم یون نیترات یا آمونیوم حاصل از تثبیت زیستی دریافت شود."}]},{"id":"ch7_g2","number":2,"title":"جانداران مؤثر در تغذیهٔ گیاهی","pages":"۱۰۲ تا ۱۰۴","summary":["قارچ‌ریشه‌ای (میکوریزا): همزیستی ریشه گیاهان با قارچ‌ها در حدود ۹۰٪ گیاهان دانه دار. قارچ مواد آلی دریافت کرده و سطح جذب آب و مواد معدنی به ویژه فسفات را به شدت افزایش می‌دهد.","باکتری‌های تثبیت‌کننده نیتروژن: ۱. ریزوبیوم‌ها درون گرهک‌های ریشه گیاهان تیره پروانه‌واران (سویا، نخود، یونجه، لوبیا) ۲. سیانوباکتری‌های فتوسنتزکننده درون ساقه و دمبرگ گیاه آزولا و گونرا.","تناوب کشت: کاشت متناوب گیاهان پروانه‌واران برای غنی‌سازی خاک از نیتروژن به روش طبیعی.","گیاهان حشره‌خوار: فتوسنتزکننده‌اند اما در خاک‌های فقیر از نیتروژن زندگی می‌کنند و برای تأمین نیتروژن حشرات را شکار و گوارش می‌کنند (مانند توبره‌واش در تالاب‌های شمال ایران).","گیاهان انگل: فاقد ریشه واقعی یا کلروفیل، با ایجاد اندام‌های مکنده به آوندهای گیاه میزبان نفوذ کرده و مواد را می‌دزدند (گیاه سس با ساقه‌های زرد/نارنجی و گل جالیز روی ریشه گوجه‌فرنگی)."],"keyPoints":["قارچ‌ریشه‌ای یک رابطه همزیستی دوجانبه سودمند (Mutualism) است نه یک رابطه انگلی.","گیاهان حشره‌خوار فتوسنتز می‌کنند و کربوهیدرات می‌سازند؛ شکار حشرات صرفاً جهت تأمین نیتروژن است.","گیاه سس فاقد ریشه است و اندام‌های مکنده خود را مستقیماً به آوندهای ساقه میزبان متصل می‌کند."],"terms":[{"term":"قارچ‌ریشه‌ای (میکوریزا)","explanation":"همزیستی سودمند بین قارچ‌های خاکزی و ریشه گیاهان جهت تسهیل جذب فسفات و آب."},{"term":"گرهک ریشه","explanation":"برجستگی‌های روی ریشه گیاهان تیره پروانه‌واران که محل استقرار باکتری‌های ریزوبیوم است."},{"term":"گیاه سس","explanation":"گیاه انگل فاقد ریشه و سبزینه که با رشته‌های زردرنگ دور میزبان می‌پیچد."}],"practiceQuestions":[{"question":"چرا کشاورزان از تناوب کشت با کاشت یونجه یا شبدر استفاده می‌کنند؟","answer":"چون یونجه از تیره پروانه‌واران است و دارای گرهک‌های حاوی ریزوبیوم می‌باشد. پس از برداشت، گرهک‌های ریشه در خاک تجزیه شده و خاک را از نیتروژن آلی تثبیت‌شده غنی می‌سازند."}]},{"id":"ch7_g3","number":3,"title":"انتقال مواد در گیاهان","pages":"۱۰۵ تا ۱۱۸","summary":["انتقال در مسیر کوتاه (عرض ریشه): ۱. مسیر آپوپلاستی (حرکت از دیواره‌های سلولی و فضاهای بین‌سلولی) ۲. مسیر سیمپلاستی (حرکت سیتوپلاسمی از طریق پلاسمودسم‌ها) ۳. مسیر عرض غشایی (ورود و خروج مکرر از غشای پلاسمایی).","درون‌پوست (آندودرم) و نوار کاسپاری: درونی‌ترین لایه پوست ریشه؛ دارای نوار چوب‌پنبه‌ای (سوبرین) کاسپاری در دیواره جانبی که مانع مسیر آپوپلاستی شده و به عنوان صافی کنترل‌کننده عمل می‌کند. یاخته‌های معبر نعلی‌شکل فاقد نوارند.","صعود شیره خام در آوند چوبی: تعرق مهم‌ترین نیروی مکش است (ایجاد مکش تعرقی، چسبندگی و پیوستگی ستون آب ناشی از پیوندهای هیدروژنی)؛ فشار ریشه‌ای (انتقال فعال یون‌ها به درون آوند چوبی ریشه و ورود آب به دلیل شیب اسمزی).","مکانیسم باز و بسته شدن روزنه‌ها: انباشت پتاسیم (+K) و کلر (-Cl) و ساکارز در یاخته‌های نگهبان روزنه -> افزایش فشار اسمزی و ورود آب -> تورژسانس و به دلیل آرایش شعاعی رشته‌های سلولز و ضخامت کمتر دیواره پشتی، خم شدن یاخته‌ها و باز شدن روزن.","تعریق: خروج قطرات آب مایع از روزنه‌های آبی همیشه باز در انتهای برگ‌ها به علت بالا بودن فشار ریشه‌ای در شب یا هوای مرطوب.","جریان فشاری شیره پرورده (نظریه ارنست مونش): بارگیری فعال آبکشی قند در منبع -> افزایش فشار اسمزی و ورود آب از آوند چوبی مجاور -> حرکت توده‌ای با شیب فشار به سمت محل مصرف -> باربرداری فعال آبکشی قند در مصرف و خروج آب."],"keyPoints":["نوار کاسپاری درون‌پوست ریشه مسیر آپوپلاستی را کاملاً مسدود می‌کند و مواد مجبورند وارد مسیر سیمپلاستی شوند.","تعریق نشان‌دهنده عملکرد فشار ریشه‌ای است و از روزنه‌های آبی همیشه باز حاشیه برگ‌ها خارج می‌شود، نه از روزنه‌های هوایی.","در الگوی مونش، بارگیری در منبع و باربرداری در مصرف هر دو فرایندهای فعالی هستند که به انرژی زیستی (ATP) نیاز دارند."],"terms":[{"term":"نوار کاسپاری","explanation":"نوار از جنس سوبرین (چوب‌پنبه) در دیواره یاخته‌های درون‌پوست ریشه که مانع عبور آپوپلاستی آب است."},{"term":"تعریق","explanation":"خروج قطره‌ای آب به همراه املاح از روزنه‌های آبی در حاشیه برگ‌ها ناشی از فشار ریشه‌ای."},{"term":"الگوی جریان فشاری مونش","explanation":"سازوکار جابه‌جایی شیره پرورده در آوند آبکشی با شیب فشار هیدروستاتیک بین منبع و مصرف."}],"practiceQuestions":[{"question":"چرا ساختار یاخته‌های نگهبان روزنه هنگام تورژسانس باعث باز شدن روزن می‌شود؟","answer":"به دلیل دو ویژگی ساختاری: ۱. کمربندهای شعاعی رشته‌های سلولزی که مانع گشاد شدن عرضی شده و فقط اجازه طویل شدن می‌دهند ۲. ضخامت بیشتر دیواره مجاور روزن نسبت به دیواره پشتی نازک که هنگام تورم باعث خمیدگی یاخته به سمت بیرون و گشوده شدن منفذ می‌گردد."}]}]}];

    const QUESTIONS = [{"id":"q1_1","chapterId":"ch1","goftarNumber":1,"question":"کدام گزینه بیانگر یکی از محدودیت‌های قطعی علم تجربی در زیست‌شناسی است؟","options":["عدم امکان بررسی پدیده‌های مولکولی درون یاخته","ناتوانی در داوری و قضاوت پیرامون ارزش‌های هنری، اخلاقی و مفاهیم خوبی و بدی","عدم امکان مهار بیماری‌های ویروسی و باکتریایی","ناتوانی در بهره‌گیری از مدل‌سازی‌های رایانه‌ای و ریاضی"],"correctIndex":1,"explanation":"بر اساس صفحه ۳ کتاب درسی، اساس علوم تجربی مشاهده مستقیم یا غیرمستقیم پدیده‌های طبیعی است؛ بنابراین پژوهشگران علوم تجربی نمی‌توانند درباره زشتی و زیبایی، خوبی و بدی و ارزش‌های اخلاقی نظر دهند.","bookReference":"صفحه ۳ کتاب زیست‌شناسی ۱"},{"id":"q1_2","chapterId":"ch1","goftarNumber":2,"question":"در ارتباط با سطوح سازمان‌یابی حیات، کدام تعریف به درستی ارائه شده است؟","options":["اجتماع: افرادی از یک گونه که در یک زمان و مکان مشخص زندگی می‌کنند.","زیست‌بوم: شامل مجموع کل موجودات زنده ساکن سیاره زمین.","بوم‌سازگان: برهم‌کنش میان جمعیت‌های یک اجتماع با عوامل غیرزنده محیط.","جمعیت: گونه‌های متفاوتی که در یک ناحیه اقلیمی با یکدیگر تعامل دارند."],"correctIndex":2,"explanation":"طبق صفحه ۸ کتاب درسی، بوم‌سازگان (اکوسیستم) حاصل برهم‌کنش عوامل زنده (اجتماع زیستی) و عوامل غیرزنده محیطی است. تعریف افراد یک گونه در یک زمان و مکان 'جمعیت' است.","bookReference":"صفحه ۸ کتاب زیست‌شناسی ۱"},{"id":"q1_3","chapterId":"ch1","goftarNumber":3,"question":"کدام فرایند انتقال مواد از عرض غشای یاخته، همواره بدون استثنا با صرف انرژی زیستی (ATP) همراه است؟","options":["انتشار تسهیل‌شده با پروتئین‌های ناقل","گذرندگی (اسمز) آب در غشای دارای نفوذپذیری انتخابی","درون‌بری (آندوسیتوز) و برون‌رانی (اگزوسیتوز)","انتشار ساده گازهای تنفسی"],"correctIndex":2,"explanation":"بر اساس صفحات ۱۳ تا ۱۵ کتاب درسی، درون‌بری و برون‌رانی به علت جابه‌جایی ذرات بزرگ و تشکیل یا ادغام ریزکیسه‌ها همواره با صرف انرژی ATP همراه هستند.","bookReference":"صفحات ۱۴ و ۱۵ کتاب زیست‌شناسی ۱"},{"id":"q2_1","chapterId":"ch2","goftarNumber":1,"question":"تخریب یاخته‌های کناری غده‌های معده، مستقیماً کدام پیامد فیزیولوژیک را به همراه دارد؟","options":["توقف کامل ترشح پپسینوژن و هضم نشدن پروتئین‌ها","کاهش ترشح اسید کلریدریک و فقدان عامل داخلی معده که منجر به کم‌خونی خطرناک می‌شود","عدم ترشح ماده مخاطی قلیایی و سوراخ شدن فوری روده باریک","اختلال در انقباض لایه عضلانی مورب معده"],"correctIndex":1,"explanation":"بر اساس صفحه ۲۱ کتاب درسی، یاخته‌های کناری غدد معده کلریدریک اسید و عامل داخلی معده را ترشح می‌کنند. عامل داخلی برای ورود ویتامین B12 به سلول‌های روده ضروری است و فقدان آن باعث توقف تولید گلبول قرمز و کم‌خونی وخیم می‌گردد.","bookReference":"صفحه ۲۱ کتاب زیست‌شناسی ۱"},{"id":"q2_2","chapterId":"ch2","goftarNumber":2,"question":"در انسان، مولکول‌های حاصل از گوارش لیپیدها (تری‌گلیسریدها) پس از عبور از سلول‌های پوششی پرز روده، مستقیماً وارد کدام بخش می‌شوند؟","options":["مویرگ‌های خونی پرز و سپس سیاهرگ باب کبدی","مویرگ بسته لنفی درون هر پرز و سپس دستگاه لنفی","سیاهرگ فوق کبدی به صورت مستقیم به دهلیز چپ","فضای صفاق شکمی"],"correctIndex":1,"explanation":"طبق صفحه ۲۶ کتاب درسی، محصولات گوارش چربی‌ها به دلیل ساختار آبگریز ابتدا وارد مویرگ لنفی بن‌بست موجود در مرکز پرز روده می‌شوند و بعداً از طریق مجاری لنفی به سیاهرگ‌های زیرترقوه‌ای و جریان خون می‌پیوندند.","bookReference":"صفحه ۲۶ کتاب زیست‌شناسی ۱"},{"id":"q2_3","chapterId":"ch2","goftarNumber":3,"question":"در دستگاه گوارش نشخوارکنندگان (نظیر گاو)، گوارش شیمیایی غذا به کمک آنزیم‌های گوارشی خود جانور عمدتاً در کدام بخش انجام می‌گیرد؟","options":["سیرابی با حضور باکتری‌های تجزیه‌کننده سلولز","نگاری پیش از برگشت غذا به دهان","هزارلا که وظیفه اصلی آن آبگیری است","شیردان (معده واقعی)"],"correctIndex":3,"explanation":"بر اساس صفحه ۳۲ کتاب درسی، شیردان معده واقعی نشخوارکنندگان است که در آن آنزیم‌های گوارشی ترشح شده توسط خود حیوان وارد عمل می‌شوند و گوارش شیمیایی انجام می‌شود.","bookReference":"صفحه ۳۲ کتاب زیست‌شناسی ۱"},{"id":"q3_1","chapterId":"ch3","goftarNumber":1,"question":"بیشترین مقدار دی‌اکسید کربن (CO2) در خون انسان به چه شکلی حمل و منتقل می‌شود؟","options":["به صورت گاز محلول فیزیکی در خوناب (پلاسما)","متصل به گروه‌های آمین پروتئین هموگلوبین (کربامینوهموگلوبین)","به صورت یون بی‌کربنات محلول در پلاسما به کمک آنزیم کربنیک انیدراز","ترکیب شده با مولکول گلوکز"],"correctIndex":2,"explanation":"بر اساس صفحه ۳۹ کتاب درسی، بیشترین مقدار کربن دی‌اکسید (حدود ۷۰ درصد) به صورت یون بی‌کربنات در خون حمل می‌شود. آنزیم کربنیک انیدراز در گویچه قرمز این واکنش را تسریع می‌کند.","bookReference":"صفحه ۳۹ کتاب زیست‌شناسی ۱"},{"id":"q3_2","chapterId":"ch3","goftarNumber":2,"question":"کدام گزینه رابطه درستی را درباره ظرفیت‌های تنفسی در یک فرد بالغ و سالم بیان می‌کند؟","options":["ظرفیت حیاتی برابر است با مجموع حجم جاری و حجم باقیمانده","ظرفیت تام برابر است با ظرفیت حیاتی به علاوه حجم باقیمانده","حجم باقیمانده در بازدم بسیار عمیق به طور کامل از شش‌ها تخلیه می‌شود","هوای مرده بخشی از ظرفیت حیاتی است که درون حبابک‌ها باقی می‌ماند"],"correctIndex":1,"explanation":"مطابق صفحه ۴۳ کتاب درسی، ظرفیت تام حداکثر مقدار هوایی است که شش‌ها می‌توانند در خود جای دهند و برابر با مجموع ظرفیت حیاتی و حجم باقیمانده است.","bookReference":"صفحه ۴۳ کتاب زیست‌شناسی ۱"},{"id":"q3_3","chapterId":"ch3","goftarNumber":3,"question":"در کدام گروه از جانوران، دستگاه گردش مواد نقشی در تبادل و انتقال گازهای تنفسی (اکسیژن و کربن دی‌اکسید) ندارد؟","options":["حشرات با تنفس نایدیسی","ماهیان با تنفس آبششی","کرم خاکی با تنفس پوستی","پرندگان با کیسه‌های هوادار"],"correctIndex":0,"explanation":"بر اساس صفحه ۴۵ کتاب درسی، در حشرات نایدیس‌ها انشعابات بسیار باریکی هستند که مستقیماً تا مجاورت تمام یاخته‌های بدن امتداد دارند؛ بنابراین دستگاه گردش مواد در انتقال گازهای تنفسی نقشی ندارد.","bookReference":"صفحه ۴۵ کتاب زیست‌شناسی ۱"},{"id":"q4_1","chapterId":"ch4","goftarNumber":1,"question":"صدای اول قلب (پوم) مربوط به کدام رویداد مکانیکی قلب است؟","options":["بسته شدن دریچه‌های سینی در ابتدای استراحت بطن‌ها","بسته شدن دریچه‌های دولختی و سه‌لختی در شروع انقباض بطن‌ها","باز شدن دریچه‌های دهلیزی-بطنی در آغاز انقباض دهلیزها","تخلیه خون به داخل سیاهرگ‌های ششی"],"correctIndex":1,"explanation":"طبق صفحه ۵۰ کتاب درسی، صدای اول (پوم) قوی‌تر و طولانی‌تر بوده و مربوط به بسته شدن دریچه‌های دولختی و سه‌لختی هنگام شروع انقباض بطن‌هاست.","bookReference":"صفحه ۵۰ کتاب زیست‌شناسی ۱"},{"id":"q4_2","chapterId":"ch4","goftarNumber":2,"question":"کدام نوع از مویرگ‌های خونی در کبد و طحال مشاهده می‌شود و چه ویژگی ساختاری دارد؟","options":["مویرگ پیوسته با اتصالات بسیار محکم بین‌یاخته‌ای","مویرگ منفذدار با غشای پایه ضخیم","مویرگ ناپیوسته با فاصله‌ها و حفرات گشاد در دیواره برای عبور پروتئین‌ها","مویرگ بدون غشای پایه"],"correctIndex":2,"explanation":"بر اساس صفحه ۵۷ کتاب درسی، در کبد و طحال و مغز استخوان مویرگ‌های ناپیوسته وجود دارند که در دیواره آنها حفرات و شکاف‌های درشتی وجود دارد تا تبادل درشت‌مولکول‌ها ممکن شود.","bookReference":"صفحه ۵۷ کتاب زیست‌شناسی ۱"},{"id":"q4_3","chapterId":"ch4","goftarNumber":3,"question":"کدام هورمون با کاهش غلظت اکسیژن خون از کلیه و کبد ترشح شده و تولید گلبول‌های قرمز را در مغز قرمز استخوان افزایش می‌دهد؟","options":["ترومبین","اریتروپویتین","سکرتین","پروترومبیناز"],"correctIndex":1,"explanation":"طبق صفحه ۶۳ کتاب درسی، هورمون اریتروپویتین توسط یاخته‌های کلیه و کبد ترشح می‌شود و روی یاخته‌های بنیادی مغز استخوان اثر کرده تا سرعت تولید گویچه‌های قرمز را افزایش دهد.","bookReference":"صفحه ۶۳ کتاب زیست‌شناسی ۱"},{"id":"q5_1","chapterId":"ch5","goftarNumber":1,"question":"در ساختار گردیزه (نفرون)، محل قرارگیری کلافک (گلومرول) کجاست و میان کدام رگ‌ها قرار دارد؟","options":["درون قوس هنله و میان دو مویرگ خونی","درون کپسول بومن و میان سرخرگ آوران و سرخرگ وابران","در لگنچه کلیه و متصل به سیاهرگ کلیه","در لوله پیچ‌خورده دور و متصل به میزنای"],"correctIndex":1,"explanation":"طبق صفحه ۷۲ کتاب درسی، کلافک شبکه مویرگی است که درون کپسول بومن قرار دارد و خون از طریق سرخرگ آوران به آن وارد و از طریق سرخرگ وابران از آن خارج می‌شود.","bookReference":"صفحه ۷۲ کتاب زیست‌شناسی ۱"},{"id":"q5_2","chapterId":"ch5","goftarNumber":2,"question":"در مرحله تشکیل ادرار، کدام ماده در فرد سالم در لوله پیچ‌خورده نزدیک به صورت صد درصد بازجذب می‌شود؟","options":["اوره","گلوکز و آمینواسیدها","اسید اوریک","یون بی‌کربنات"],"correctIndex":1,"explanation":"بر اساس صفحه ۷۴ کتاب درسی، مواد مفید مانند گلوکز و آمینواسیدها در لوله پیچ‌خورده نزدیک کلیه به طور کامل بازجذب شده و به خون بازمی‌گردند.","bookReference":"صفحه ۷۴ کتاب زیست‌شناسی ۱"},{"id":"q5_3","chapterId":"ch5","goftarNumber":3,"question":"ماهیان آب شیرین در مقایسه با ماهیان آب شور، به چه ترتیبی تعادل آب و نمک بدن خود را حفظ می‌کنند؟","options":["آب زیادی می‌نوشند و ادراری بسیار غلیظ دفع می‌کنند","آب نمی‌نوشند، حجم زیادی ادرار رقیق دفع کرده و نمک را فعالانه از آبشش جذب می‌کنند","نمک را از طریق غدد راست‌روده‌ای به خارج ترشح می‌کنند","به وسیله لوله‌های مالپیگی اوره دفع می‌نمایند"],"correctIndex":1,"explanation":"طبق صفحه ۷۷ کتاب درسی، فشار اسمزی مایعات بدن ماهیان آب شیرین بیشتر از آب محیط است؛ بنابراین آب به بدن نفوذ می‌کند و آنها آب زیادی نمی‌نوشند و حجم زیادی ادرار رقیق دفع می‌کنند.","bookReference":"صفحه ۷۷ کتاب زیست‌شناسی ۱"},{"id":"q6_1","chapterId":"ch6","goftarNumber":1,"question":"قدیمی‌ترین لایه تشکیل‌دهنده دیواره یاخته‌ای گیاهی کدام است و ماده اصلی تشکیل‌دهنده آن چیست؟","options":["دیواره پسین از جنس لیگنین","دیواره نخستین از جنس سلولز","تیغه میانی از جنس پکتین","پلاسمودسم از جنس سیتوپلاسم"],"correctIndex":2,"explanation":"بر اساس صفحه ۸۰ کتاب درسی، هنگام تقسیم یاخته گیاهی ابتدا لایه‌ای به نام تیغه میانی از جنس پکتین تشکیل می‌شود که مانند چسب دو یاخته را کنار هم نگه می‌دارد و خارجی‌ترین و قدیمی‌ترین لایه است.","bookReference":"صفحه ۸۰ کتاب زیست‌شناسی ۱"},{"id":"q6_2","chapterId":"ch6","goftarNumber":2,"question":"تنها یاخته‌های سامانه بافت روپوست که دارای کلروپلاست (سبزدیسه) بوده و فتوسنتز می‌کنند کدام‌اند؟","options":["کرک‌های محافظتی","تارهای کشنده ریشه","یاخته‌های نگهبان روزنه هوایی","یاخته‌های روپوستی معمولی پوشیده از پوستک"],"correctIndex":2,"explanation":"مطابق صفحه ۸۷ کتاب درسی، یاخته‌های نگهبان روزنه بر خلاف سایر یاخته‌های روپوست، دارای سبزینه (کلروپلاست) هستند و با فتوسنتز و تغییر فشار اسمزی باز و بسته شدن روزنه را تنظیم می‌کنند.","bookReference":"صفحه ۸۷ کتاب زیست‌شناسی ۱"},{"id":"q6_3","chapterId":"ch6","goftarNumber":3,"question":"کامبیوم چوب‌آبکش (آوندساز) در گیاهان چوبی دولپه، به ترتیب به سمت داخل و خارج چه بافت‌هایی تولید می‌کند؟","options":["به سمت داخل آوند چوبی پسین و به سمت بیرون آوند آبکش پسین","به سمت داخل چوب‌پنبه و به سمت خارج پارانشیم","به سمت داخل روپوست و به سمت خارج پوستک","به سمت داخل آبکش پسین و به سمت خارج چوب پسین"],"correctIndex":0,"explanation":"طبق صفحه ۹۳ کتاب درسی، کامبیوم چوب‌آبکش آوندهای چوب پسین را به سمت داخل و آوندهای آبکش پسین را به سمت بیرون تولید می‌کند و حجم چوب تولیدی بسیار بیشتر است.","bookReference":"صفحه ۹۳ کتاب زیست‌شناسی ۱"},{"id":"q7_1","chapterId":"ch7","goftarNumber":1,"question":"چرا گیاخاک (هوموس) به حاصلخیزی خاک کشاورزی و نگهداری یون‌های معدنی کمک شایانی می‌کند؟","options":["به دلیل داشتن بارهای منفی که یون‌های مثبت مغذی را جذب و مانع شست‌وشوی آنها می‌شود","به دلیل خاصیت اسیدی شدید که تمام باکتری‌های خاک را از بین می‌برد","به دلیل تولید گاز اکسیژن خالص در زیر خاک","به خاطر دارا بودن نیتروژن مولکولی غیرمعدنی"],"correctIndex":0,"explanation":"بر اساس صفحه ۹۸ کتاب درسی، گیاخاک با داشتن بارهای منفی، یون‌های مثبت مانند کلسیم و پتاسیم را در سطح خود نگه می‌دارد و مانع شست‌وشوی این یون‌ها با آب باران و آبیاری می‌شود.","bookReference":"صفحه ۹۸ کتاب زیست‌شناسی ۱"},{"id":"q7_2","chapterId":"ch7","goftarNumber":2,"question":"در رابطه همزیستی قارچ‌ریشه‌ای (میکوریزا) با ریشه گیاهان، تبادل مواد به چه ترتیبی است؟","options":["گیاه نیتروژن جو را به قارچ داده و قارچ برای گیاه قند تولید می‌کند","قارچ مواد معدنی به ویژه فسفات و آب برای گیاه جذب می‌کند و مواد آلی را از ریشه می‌گیرد","قارچ انگل ریشه بوده و شیره پرورده را به طور یک‌طرفه می‌مکد","گیاه باکتری‌های ریزوبیوم را به قارچ منتقل می‌کند"],"correctIndex":1,"explanation":"طبق صفحه ۱۰۲ کتاب درسی، در قارچ‌ریشه‌ای قارچ مواد آلی را از ریشه می‌گیرد و در عوض به دلیل شبکه گسترده رشته‌های ظریف، مواد معدنی به ویژه فسفات و آب را از خاک برای گیاه جذب می‌کند.","bookReference":"صفحه ۱۰۲ کتاب زیست‌شناسی ۱"},{"id":"q7_3","chapterId":"ch7","goftarNumber":3,"question":"در ریشه گیاه، نوار کاسپاری در یاخته‌های کدام لایه بافت قرار دارد و مانع عبور مواد از کدام مسیر می‌شود؟","options":["روپوست - مسیر سیمپلاستی","پارانشیم پوست - مسیر عرض غشایی","درون‌پوست (آندودرم) - مسیر آپوپلاستی","کلاهک ریشه - مسیر آوندی"],"correctIndex":2,"explanation":"بر اساس صفحه ۱۰۶ کتاب درسی، نوار کاسپاری از جنس سوبرین (چوب‌پنبه) در دیواره جانبی یاخته‌های درون‌پوست (آندودرم) قرار دارد و سدی نفوذناپذیر در برابر مسیر آپوپلاستی ایجاد می‌کند.","bookReference":"صفحه ۱۰۶ کتاب زیست‌شناسی ۱"}];
    const FLASHCARDS = [{"id":"fc1","chapterId":"ch1","front":"تعریف کل‌نگری در زیست‌شناسی نوین چیست؟","back":"نگاه به جاندار به عنوان یک سامانه یکپارچه؛ ویژگی‌های کل سامانه از مجموع ویژگی‌های تک‌تک اجزای سازنده آن فراتر است و در تعامل اجزا پدید می‌آید.","tag":"مفاهیم پایه"},{"id":"fc2","chapterId":"ch1","front":"هم‌ایستایی (هومئوستازی) چیست و مثالی از آن در بدن انسان بزنید؟","back":"مجموعه اعمالی که برای پایدار نگه داشتن وضعیت درونی بدن در یک محدوده ثابت انجام می‌شود؛ مانند افزایش دفع سدیم و آب از طریق کلیه‌ها هنگام افزایش نمک خون.","tag":"فیزیولوژی"},{"id":"fc3","chapterId":"ch1","front":"تفاوت انتشار تسهیل‌شده با انتقال فعال چیست؟","back":"هر دو با پروتئین‌های غشا انجام می‌شوند، اما انتشار تسهیل‌شده در جهت شیب غلظت و بدون مصرف ATP است؛ انتقال فعال برخلاف شیب غلظت و با صرف انرژی زیستی ATP انجام می‌گیرد.","tag":"یاخته"},{"id":"fc4","chapterId":"ch2","front":"وظیفه یاخته‌های کناری در غده‌های معده چیست؟","back":"ترشح اسید کلریدریک (HCl) برای فعال‌سازی پپسینوژن و ترشح عامل (فاکتور) داخلی معده که برای جذب ویتامین B12 در روده باریک حیاتی است.","tag":"گوارش انسان"},{"id":"fc5","chapterId":"ch2","front":"مسیر جذب قندها و اسیدهای آمینه در روده با اسیدهای چرب چه تفاوتی دارد؟","back":"قندها و اسیدهای آمینه وارد مویرگ‌های خونی پرز و سپس سیاهرگ باب کبد می‌شوند؛ اما اسیدهای چرب وارد مویرگ بسته لنفی پرز شده و از مسیر لنف وارد گردش خون می‌گردند.","tag":"جذب روده"},{"id":"fc6","chapterId":"ch2","front":"معده چهار قسمتی نشخوارکنندگان به چه ترتیبی است و کدام بخش معده واقعی است؟","back":"سیرابی -> نگاری -> هزارلا -> شیردان. شیردان معده واقعی است چون آنزیم‌های گوارشی شیره معده در آن ترشح و فعال می‌شوند.","tag":"گوارش مقایسه‌ای"},{"id":"fc7","chapterId":"ch3","front":"عامل سطح‌فعال (سورفاکتانت) چیست و چه یاخته‌ای آن را می‌سازد؟","back":"ماده‌ای که از یاخته‌های نوع دوم حبابک ترشح می‌شود و با کاهش نیروی کشش سطحی آب، باز شدن حبابک‌ها را تسهیل و مانع چسبیدن آنها می‌شود.","tag":"تنفس انسان"},{"id":"fc8","chapterId":"ch3","front":"بیشترین حجم کربن دی‌اکسید خون چگونه حمل می‌شود؟","back":"حدود ۷۰ درصد آن به صورت یون بی‌کربنات (HCO3-) در پلاسما، با کاتالیز آنزیم کربنیک انیدراز درون گویچه‌های قرمز حمل می‌شود.","tag":"خون و گازها"},{"id":"fc9","chapterId":"ch3","front":"تنفس نایدیسی حشرات چه ویژگی منحصربه‌فردی در رابطه با گردش خون دارد؟","back":"نایدیس‌ها مستقیماً تا کنار تک‌تک یاخته‌ها انشعاب می‌یابند؛ بنابراین دستگاه گردش خون و همولنف هیچ نقشی در جابه‌جایی گازهای تنفسی ندارند.","tag":"تنفس جانوری"},{"id":"fc10","chapterId":"ch4","front":"گره پیشاهنگ (سینوسی-دهلیزی) قلب در کجا قرار دارد و کار آن چیست؟","back":"در دیواره پشتی دهلیز راست و زیر منفذ بزرگ سیاهرگ زبرین قرار دارد؛ تکانه‌های الکتریکی خودبه‌خودی شروع انقباض قلب را تولید و ریتم ضربان را هدایت می‌کند.","tag":"قلب"},{"id":"fc11","chapterId":"ch4","front":"تفاوت مویرگ منفذدار با مویرگ ناپیوسته چیست؟","back":"مویرگ منفذدار روزنه‌های فراوان در غشا دارد اما غشای پایه ضخیم مانع خروج پروتئین‌هاست (کلیه)؛ مویرگ ناپیوسته شکاف‌های بسیار درشت بین‌سلولی دارد و عبور پروتئین‌های درشت را ممکن می‌سازد (کبد).","tag":"رگ‌ها"},{"id":"fc12","chapterId":"ch4","front":"تفاوت گردش ساده در ماهی با گردش مضاعف در پستانداران چیست؟","back":"در گردش ساده، خون در یک دور کامل فقط یک بار از قلب دوحفره‌ای می‌گذرد؛ در گردش مضاعف، خون دو بار از قلب چهارحفره‌ای می‌گذرد (یک‌بار برای تبادل ششی و یک‌بار برای پمپ پرفشار به کل بدن).","tag":"گردش مواد مقایسه‌ای"},{"id":"fc13","chapterId":"ch5","front":"یاخته‌های پودوسیت در کجا قرار دارند و چه نقشی دارند؟","back":"در دیواره درونی کپسول بومن کلیه؛ پاهای کوتاه آنها اطراف مویرگ‌های کلافک را احاطه کرده و شکاف‌های تراوشی باریکی برای تنظیم خروج خوناب ایجاد می‌کنند.","tag":"کلیه"},{"id":"fc14","chapterId":"ch5","front":"هورمون ضدادراری (ADH) چگونه ترشح می‌شود و چه نقشی دارد؟","back":"با افزایش اسمولاریته خوناب از هیپوتالاموس/هیپوفیز ترشح می‌شود و با افزایش بازجذب آب در لوله‌های جمع‌کننده کلیه، ادرار را غلیظ و آب بدن را حفظ می‌کند.","tag":"تنظیم اسمزی"},{"id":"fc15","chapterId":"ch5","front":"سامانه دفعی مالپیگی در حشرات چگونه کار می‌کند؟","back":"لوله‌های کور متصل به روده هستند که اسید اوریک، آب و املاح را دریافت می‌کنند؛ در روده آب و یون‌ها بازجذب شده و اسید اوریک نیمه‌جامد با مدفوع دفع می‌شود.","tag":"دفع جانوری"},{"id":"fc16","chapterId":"ch6","front":"پلاسمودسم و لان در یاخته گیاهی چه هستند؟","back":"پلاسمودسم کانال‌های سیتوپلاسمی است که از دیواره گذشته و پروتوپلاست یاخته‌های مجاور را متصل می‌کند؛ لان به ناحیه نازک دیواره سلولی گفته می‌شود که پلاسمودسم‌ها در آن متمرکزند.","tag":"بافت گیاهی"},{"id":"fc17","chapterId":"ch6","front":"تفاوت بافت کلانشیم با اسکلرانشیم چیست؟","back":"کلانشیم سلول‌های زنده با دیواره نخستین ضخیم و بدون لیگنین است که انعطاف‌پذیری و رشد می‌دهد؛ اسکلرانشیم دیواره پسین لیگنینی ضخیم دارد، یاخته‌هایش مرده‌اند و مانع رشد هستند.","tag":"بافت گیاهی"},{"id":"fc18","chapterId":"ch6","front":"سازش‌های ساختاری گیاه خرزهره برای مقابله با کم‌آبی چیست؟","back":"پوستک بسیار ضخیم روی روپوست، و قرارگیری روزنه‌ها در فرورفتگی‌های غارمانند همراه با کرک‌های فراوان برای به دام انداختن هوای مرطوب.","tag":"سازش گیاهی"},{"id":"fc19","chapterId":"ch7","front":"نوار کاسپاری در کدام لایه ریشه قرار دارد و کارکرد آن چیست؟","back":"در دیواره جانبی یاخته‌های درون‌پوست (آندودرم) از جنس سوبرین (چوب‌پنبه) است و مسیر آپوپلاستی را مسدود می‌کند تا ورود تمام مواد به آوند چوبی توسط غشای پلاسمایی کنترل شود.","tag":"انتقال در گیاه"},{"id":"fc20","chapterId":"ch7","front":"نیروی اصلی در صعود شیره خام به ارتفاع ده‌ها متری در درختان چیست؟","back":"مکش تعرقی ایجادشده ناشی از تبخیر آب از روزنه‌های برگ، همراه با پیوستگی ستون آب به دلیل خاصیت هم‌چسبی و دگرچسبی مولکول‌های آب.","tag":"انتقال در گیاه"},{"id":"fc21","chapterId":"ch7","front":"سازوکار جریان فشاری ارنست مونش در آوند آبکش چگونه کار می‌کند؟","back":"بارگیری فعال قند در منبع -> افزایش فشار اسمزی و ورود آب -> ایجاد فشار هیدروستاتیک و حرکت توده‌ای به سمت مصرف -> باربرداری فعال قند در مصرف و خروج آب.","tag":"شیره پرورده"}];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function renderChapters() {
      const el = document.getElementById('chapters-list');
      el.innerHTML = CHAPTERS.map(ch => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <h3 style="color:#065f46; font-size:1.3rem;">فصل ${ch.number}: ${ch.title}</h3>
            <span class="badge">صفحه ${ch.pages}</span>
          </div>
          <p style="color:#475569; margin-bottom:1rem;">${ch.description}</p>
          <div style="background:#f1f5f9; padding:1rem; border-radius:0.5rem;">
            <h4 style="font-size:0.95rem; margin-bottom:0.5rem; color:#1e293b;">گفتارهای این فصل:</h4>
            ${ch.goftars.map(g => `
              <div style="padding:0.4rem 0; border-bottom:1px dashed #cbd5e1;">
                <strong>گفتار ${g.number}: ${g.title}</strong> (صفحه ${g.pages})
                <ul style="padding-right:1.2rem; font-size:0.85rem; color:#475569; margin-top:0.3rem;">
                  ${g.summary.map(s => `<li>${s}</li>`).join('')}
                </ul>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    let currentFc = 0;
    let showingFront = true;
    function renderFlashcard() {
      const c = FLASHCARDS[currentFc];
      document.getElementById('fc-tag').innerText = c.tag;
      document.getElementById('fc-text').innerText = showingFront ? c.front : c.back;
      document.getElementById('fc-counter').innerText = (currentFc + 1) + ' از ' + FLASHCARDS.length;
      document.getElementById('fc-card').style.background = showingFront ? '#ecfdf5' : '#eff6ff';
    }
    function toggleFlashcard() { showingFront = !showingFront; renderFlashcard(); }
    function nextCard() { currentFc = (currentFc + 1) % FLASHCARDS.length; showingFront = true; renderFlashcard(); }
    function prevCard() { currentFc = (currentFc - 1 + FLASHCARDS.length) % FLASHCARDS.length; showingFront = true; renderFlashcard(); }

    function renderDict() {
      const query = (document.getElementById('dict-search')?.value || '').trim().toLowerCase();
      const filtered = TERMS.filter(t => t.approved.includes(query) || t.previous.includes(query) || t.latin.toLowerCase().includes(query));
      document.getElementById('dict-list').innerHTML = filtered.map(t => `
        <div style="background:white; border:1px solid #e2e8f0; border-radius:0.5rem; padding:0.8rem;">
          <div style="font-weight:700; color:#065f46; font-size:1.1rem;">${t.approved}</div>
          <div style="font-size:0.85rem; color:#64748b;">واژه قبلی: ${t.previous} | لاتین: <em>${t.latin}</em></div>
          <span class="badge" style="margin-top:0.4rem;">فصل ${t.chapter}</span>
        </div>
      `).join('');
    }

    let quizIdx = 0;
    let userAnswers = {};
    function renderQuiz() {
      const q = QUESTIONS[quizIdx];
      const answered = userAnswers[q.id] !== undefined;
      const html = `
        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
          <span class="badge">سوال ${quizIdx + 1} از ${QUESTIONS.length}</span>
          <span style="font-size:0.85rem; color:#64748b;">${q.bookReference}</span>
        </div>
        <h3 style="margin-bottom:1.2rem; font-size:1.1rem; line-height:1.7;">${q.question}</h3>
        ${q.options.map((opt, i) => {
          let cls = 'option-btn';
          if (answered) {
            if (i === q.correctIndex) cls += ' correct';
            else if (i === userAnswers[q.id]) cls += ' wrong';
          }
          return `<button class="${cls}" onclick="pickAnswer('${q.id}', ${i})">${i+1}) ${opt}</button>`;
        }).join('')}
        ${answered ? `
          <div style="background:#f0fdf4; border:1px solid #86efac; border-radius:0.5rem; padding:1rem; margin-top:1rem;">
            <strong>توضیح پاسخ:</strong> ${q.explanation}
          </div>
        ` : ''}
        <div style="display:flex; justify-content:space-between; margin-top:1.5rem;">
          <button class="btn" onclick="prevQuiz()" ${quizIdx === 0 ? 'disabled style="opacity:0.5"' : ''}>سوال قبلی</button>
          <button class="btn" onclick="nextQuiz()" ${quizIdx === QUESTIONS.length - 1 ? 'disabled style="opacity:0.5"' : ''}>سوال بعدی</button>
        </div>
      `;
      document.getElementById('quiz-body').innerHTML = html;
    }
    function pickAnswer(qid, optIdx) {
      if (userAnswers[qid] !== undefined) return;
      userAnswers[qid] = optIdx;
      renderQuiz();
    }
    function nextQuiz() { if (quizIdx < QUESTIONS.length - 1) { quizIdx++; renderQuiz(); } }
    function prevQuiz() { if (quizIdx > 0) { quizIdx--; renderQuiz(); } }

    function saveNote() {
      const text = document.getElementById('note-input').value.trim();
      if (!text) return;
      const notes = JSON.parse(localStorage.getItem('zist10_offline_notes') || '[]');
      notes.unshift({ text, date: new Date().toLocaleDateString('fa-IR') });
      localStorage.setItem('zist10_offline_notes', JSON.stringify(notes));
      document.getElementById('note-input').value = '';
      renderNotes();
    }
    function renderNotes() {
      const notes = JSON.parse(localStorage.getItem('zist10_offline_notes') || '[]');
      document.getElementById('notes-list').innerHTML = notes.map((n, i) => `
        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.5rem; padding:0.8rem; margin-bottom:0.5rem;">
          <div style="font-size:0.8rem; color:#64748b; margin-bottom:0.3rem;">${n.date}</div>
          <div>${n.text}</div>
        </div>
      `).join('') || '<p style="color:#94a3b8;">هنوز یادداشتی ثبت نشده است.</p>';
    }

    renderChapters();
    renderFlashcard();
    renderDict();
    renderQuiz();
    renderNotes();
  </script>
</body>
</html>
